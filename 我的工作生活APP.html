<script>
/* ==== js/61-plan.js ==== */
/* 61-plan.js — 今日计划页：时间轴日程（拖拽）＋待办（顺延）＋每日回顾
   timelineLayout 为纯函数，可 Node 测试 */
(function (root, factory) {
  factory(root.App = root.App || {});
})(typeof globalThis !== 'undefined' ? globalThis : this, function (App) {
  'use strict';

  var U = App.util, L = App.logic;
  var P = {};
  App.planPage = P;

  P.DAY_START = 6 * 60;
  P.DAY_END = 24 * 60;
  P.HOUR_PX = 44;

  /* ---- 纯布局：重叠日程分列 ----
     返回 [{id, start, end, col, colCount}]，colCount 为所属重叠簇的列数 */
  P.timelineLayout = function (events) {
    var items = (events || []).map(function (e) {
      return { id: e.id, start: U.timeToMin(e.start), end: U.timeToMin(e.end), col: 0, colCount: 1 };
    }).sort(function (a, b) { return a.start - b.start || a.end - b.end; });

    /* 贪心分列 */
    var colEnds = [];
    items.forEach(function (it) {
      var col = -1;
      for (var c = 0; c < colEnds.length; c++) if (colEnds[c] <= it.start) { col = c; break; }
      if (col === -1) { col = colEnds.length; colEnds.push(0); }
      colEnds[col] = it.end;
      it.col = col;
    });

    /* 传递性重叠簇 → 簇内列数 */
    var cluster = [];
    var clusterEnd = -1;
    function flush() {
      var n = 0;
      cluster.forEach(function (it) { n = Math.max(n, it.col + 1); });
      cluster.forEach(function (it) { it.colCount = n; });
      cluster = [];
    }
    items.forEach(function (it) {
      if (cluster.length && it.start >= clusterEnd) flush();
      cluster.push(it);
      clusterEnd = Math.max(clusterEnd, it.end);
      if (it.start >= clusterEnd) { flush(); clusterEnd = -1; }
    });
    flush();
    return items;
  };

  if (typeof document === 'undefined') {
    if (typeof module !== 'undefined' && module.exports) module.exports = (typeof globalThis !== 'undefined' ? globalThis : this).App;
    return;
  }

  var D = App.dom, ui = null; // ui 在渲染时取（App.ui 由 50-dom 注入）
  var store = App.store;
  var currentDate = U.today();
  var carryMsgDismissed = false;

  function hourPx() { return P.HOUR_PX; }

  function eventModal(ev, date) {
    ui = App.ui;
    ui.modal({
      title: ev ? '编辑日程' : '添加日程',
      values: ev || { date: date, start: '09:00', end: '10:00' },
      fields: [
        { key: 'title', label: '事项', type: 'text', required: true, placeholder: '做什么？' },
        { key: 'start', label: '开始时间', type: 'time', required: true },
        { key: 'end', label: '结束时间', type: 'time', required: true, validate: function (v, vals) { return L.validateTimeRange(vals.start, v); } },
        { key: 'note', label: '备注（选填）', type: 'textarea', rows: 2 }
      ],
      onDelete: ev ? function () { store.remove('plan.events', ev.id); render(App._view, { d: currentDate }); } : null,
      deleteText: '删除这条日程「' + (ev ? ev.title : '') + '」？',
      onSubmit: function (vals) {
        var overlaps = L.countOverlaps(store.data.plan.events, date, vals.start, vals.end, ev ? ev.id : null);
        store.upsert('plan.events', {
          id: ev ? ev.id : U.uid(), date: date, start: vals.start, end: vals.end,
          title: vals.title, note: vals.note
        });
        if (overlaps > 0) ui.toast('提示：该时段与 ' + overlaps + ' 条已有安排重叠', true);
        render(App._view, { d: currentDate });
        return null;
      }
    });
  }

  function renderTimeline(card, date) {
    var events = store.data.plan.events.filter(function (e) { return e.date === date; });
    var head = D.el('<div class="row" style="justify-content:space-between;margin-bottom:10px">' +
      '<b>时间轴日程</b><button class="btn btn-small btn-primary">＋ 添加日程</button></div>');
    head.querySelector('button').addEventListener('click', function () { eventModal(null, date); });
    card.appendChild(head);

    var layout = P.timelineLayout(events);
    var totalH = (P.DAY_END - P.DAY_START) / 60 * hourPx();
    var wrap = D.el('<div style="position:relative;height:' + totalH + 'px;border-left:1px solid var(--border);margin-left:44px">');
    /* 小时刻度 */
    for (var h = P.DAY_START / 60; h <= P.DAY_END / 60; h += 2) {
      var y = (h * 60 - P.DAY_START) / 60 * hourPx();
      wrap.appendChild(D.el('<div style="position:absolute;left:-44px;top:' + (y - 7) + 'px;width:38px;text-align:right;font-size:10px;color:var(--text-soft)">' + U.pad2(h) + ':00</div>'));
      wrap.appendChild(D.el('<div style="position:absolute;left:0;right:0;top:' + y + 'px;border-top:1px dashed var(--border)"></div>'));
    }
    if (!layout.length) {
      wrap.appendChild(D.el('<div class="muted small" style="position:absolute;left:8px;top:8px">今天还没有日程，点右上「＋ 添加日程」</div>'));
    }
    layout.forEach(function (it) {
      var ev = events.filter(function (e) { return e.id === it.id; })[0];
      var top = (it.start - P.DAY_START) / 60 * hourPx();
      var hpx = Math.max(20, (it.end - it.start) / 60 * hourPx() - 2);
      var wPct = 100 / it.colCount;
      var block = D.el('<div class="card ev-block" style="position:absolute;top:' + top + 'px;height:' + hpx + 'px;' +
        'left:calc(' + (it.col * wPct) + '% + 2px);width:calc(' + wPct + '% - 6px);padding:4px 8px;cursor:grab;overflow:hidden;' +
        'border-left:3px solid var(--mod-color);background:var(--bg-soft)">' +
        '<div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + U.esc(ev.title) + '</div>' +
        '<div class="muted" style="font-size:10px">' + ev.start + '–' + ev.end + '</div>' +
        '<div class="ev-resize" style="position:absolute;left:0;right:0;bottom:0;height:6px;cursor:ns-resize"></div></div>');
      block.title = ev.title + '（拖拽移动，底边改时长，点击编辑）';
      /* 点击编辑（未拖动时） */
      App.comp.makePointerDrag(block, {
        ignore: '.ev-resize',
        onEnd: function (dy, dx, e, moved) {
          if (!moved) { eventModal(ev, date); return; }
          var dm = Math.round(dy / hourPx() * 60 / 15) * 15;
          if (!dm) return;
          var ns = U.clamp(it.start + dm, P.DAY_START, P.DAY_END - 15);
          var shift = ns - it.start;
          store.upsert('plan.events', Object.assign({}, ev, {
            start: U.minToTime(it.start + shift), end: U.minToTime(Math.min(P.DAY_END, it.end + shift))
          }));
          render(App._view, { d: currentDate });
        },
        onMove: function (dy) { block.style.transform = 'translateY(' + dy + 'px)'; block.style.opacity = '.8'; }
      });
      /* 底边拉伸改时长 */
      App.comp.makePointerDrag(block.querySelector('.ev-resize'), {
        onEnd: function (dy, dx, e, moved) {
          if (!moved) return;
          var dm = Math.round(dy / hourPx() * 60 / 15) * 15;
          var ne = U.clamp(it.end + dm, it.start + 15, P.DAY_END);
          store.upsert('plan.events', Object.assign({}, ev, { end: U.minToTime(ne) }));
          render(App._view, { d: currentDate });
        },
        onMove: function (dy) { block.style.height = Math.max(20, hpx + dy) + 'px'; }
      });
      wrap.appendChild(block);
    });
    card.appendChild(wrap);
  }

  function renderTodos(card, date) {
    var todos = store.data.plan.todos.filter(function (t) { return t.date === date; });
    todos.sort(function (a, b) {
      if (a.done !== b.done) return a.done ? 1 : -1;
      var pr = { '高': 0, '中': 1, '低': 2 };
      return pr[a.priority] - pr[b.priority];
    });
    var head = D.el('<div class="row" style="justify-content:space-between;margin-bottom:10px"><b>待办清单</b>' +
      '<span class="muted small">' + todos.filter(function (t) { return t.done; }).length + '/' + todos.length + ' 完成</span></div>');
    card.appendChild(head);

    var add = D.el('<div class="row" style="margin-bottom:10px"><input class="input" id="todo-quick" placeholder="输入待办，回车添加"></div>');
    card.appendChild(add);
    add.querySelector('input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.target.value.trim()) {
        store.upsert('plan.todos', { id: U.uid(), date: date, text: e.target.value.trim(), priority: '中', done: false });
        render(App._view, { d: currentDate });
      }
    });

    if (!todos.length) {
      card.appendChild(ui.emptyState('✅', '今天还没有待办', null, null));
      return;
    }
    var list = D.el('<div></div>');
    todos.forEach(function (t) {
      var row = D.el('<div class="row" style="padding:6px 4px;border-bottom:1px solid var(--border);' + (t.done ? 'opacity:.55' : '') + '">' +
        '<input type="checkbox"' + (t.done ? ' checked' : '') + ' style="width:16px;height:16px">' +
        '<span style="flex:1;' + (t.done ? 'text-decoration:line-through' : '') + '">' + U.esc(t.text) + '</span></div>');
      if (t.carriedFrom) row.querySelector('span').appendChild(D.el('<span class="tag" style="margin-left:6px;font-size:10px">顺延自 ' + U.fmtDateCN(t.carriedFrom) + '</span>'));
      row.querySelector('input').addEventListener('change', function (e) {
        store.upsert('plan.todos', Object.assign({}, t, { done: e.target.checked }));
        render(App._view, { d: currentDate });
      });
      row.appendChild(App.comp.cycleCapsule(t.priority, ['高', '中', '低'], function (np) {
        store.upsert('plan.todos', Object.assign({}, t, { priority: np }));
        render(App._view, { d: currentDate });
      }));
      row.appendChild(App.comp.iconBtn('🗑', '删除待办', function () {
        ui.confirm({ title: '删除待办', text: '删除「' + t.text + '」？', danger: true }).then(function (ok) {
          if (ok) { store.remove('plan.todos', t.id); render(App._view, { d: currentDate }); }
        });
      }));
      list.appendChild(row);
    });
    card.appendChild(list);
  }

  function render(view, params) {
    ui = App.ui;
    App._view = view;
    currentDate = (params && params.d && U.isValidDateStr(params.d)) ? params.d : U.today();
    view.innerHTML = '';
    view.appendChild(D.el('<h1 class="page-title">今日计划</h1><p class="page-sub">时间安排、待办与每日回顾</p>'));

    /* 自动顺延（幂等） */
    var carried = L.carryOverTodos(store.data, U.today());
    if (carried > 0) { store.commit(); carryMsgDismissed = false; }
    if (carried > 0 && !carryMsgDismissed) {
      var banner = D.el('<div class="banner banner-warn" style="border-radius:8px;margin-bottom:12px"><span>已为你顺延 ' + carried + ' 条未完成待办到今天</span><button class="btn btn-small">知道了</button></div>');
      banner.querySelector('button').addEventListener('click', function () { carryMsgDismissed = true; banner.remove(); });
      view.appendChild(banner);
    }

    var nav = ui.dateNav(currentDate, function (d) { render(view, { d: d }); });
    view.appendChild(nav);

    var grid = D.el('<div class="grid" style="grid-template-columns:1fr 1fr;align-items:start"></div>');
    var tlCard = D.el('<div class="card"></div>');
    var todoCard = D.el('<div class="card"></div>');
    renderTimeline(tlCard, currentDate);
    renderTodos(todoCard, currentDate);
    grid.appendChild(tlCard); grid.appendChild(todoCard);
    view.appendChild(grid);

    /* 每日回顾 */
    var reviewCard = D.el('<div class="card mt16"><b>每日回顾</b><div class="muted small" style="margin:4px 0 8px">今天过得怎么样？随手写两句，自动保存</div></div>');
    var ta = D.el('<textarea class="textarea" rows="3" placeholder="今天完成了什么、有什么想法…">' + U.esc(store.data.plan.reviews[currentDate] || '') + '</textarea>');
    ta.addEventListener('input', function () {
      store.mapSet('plan.reviews', currentDate, ta.value);
    });
    reviewCard.appendChild(ta);
    view.appendChild(reviewCard);
  }

  App.shell.registerPage('plan', render);

  if (typeof module !== 'undefined' && module.exports) module.exports = (typeof globalThis !== 'undefined' ? globalThis : this).App;
});

</script>
<script>
/* ==== js/62-media.js ==== */
/* 62-media.js — 自媒体：选题库 │ 发布计划 │ 数据统计 */
(function (root, factory) {
  factory(root.App = root.App || {});
})(typeof globalThis !== 'undefined' ? globalThis : this, function (App) {
  'use strict';

  if (typeof document === 'undefined') {
    if (typeof module !== 'undefined' && module.exports) module.exports = (typeof globalThis !== 'undefined' ? globalThis : this).App;
    return;
  }

  var U = App.util, L = App.logic, D = App.dom, store = App.store;
  var TAB = 'topics', VIEW = 'week', METRIC = 'views', RANGE = '30';
  var TOPIC_STATUS = ['灵感', '制作中', '已发布', '已放弃'];

  function platforms() { return store.data.settings.platforms || []; }

  function topicModal(t) {
    App.ui.modal({
      title: t ? '编辑选题' : '新选题',
      values: t || { status: '灵感' },
      fields: [
        { key: 'title', label: '选题标题', type: 'text', required: true },
        { key: 'desc', label: '一句话说明', type: 'text' },
        { key: 'status', label: '状态', type: 'select', options: TOPIC_STATUS },
        { key: 'note', label: '备注', type: 'textarea', rows: 2 }
      ],
      onDelete: t ? function () { store.remove('media.topics', t.id); rerender(); } : null,
      onSubmit: function (v) {
        store.upsert('media.topics', Object.assign({}, t, {
          id: t ? t.id : U.uid(), title: v.title, desc: v.desc, status: v.status, note: v.note,
          createdAt: t ? t.createdAt : new Date().toISOString()
        }));
        rerender();
        return null;
      }
    });
  }

  function scheduleModal(s) {
    var topics = store.data.media.topics;
    App.ui.modal({
      title: s ? '编辑发布计划' : '新发布计划',
      values: s || { date: U.today(), platform: platforms()[0] || '', status: '计划中' },
      fields: [
        { key: 'title', label: '内容标题', type: 'text', required: true },
        { key: 'date', label: '发布日期', type: 'date', required: true },
        { key: 'platform', label: '平台', type: 'select', options: platforms() },
        { key: 'status', label: '状态', type: 'select', options: ['计划中', '已发布'] },
        { key: 'topicId', label: '关联选题（选填）', type: 'select', options: [{ value: '', label: '（不关联）' }].concat(topics.map(function (t) { return { value: t.id, label: t.title }; })) }
      ],
      onDelete: s ? function () { store.remove('media.schedule', s.id); rerender(); } : null,
      onSubmit: function (v) {
        store.upsert('media.schedule', Object.assign({}, s, {
          id: s ? s.id : U.uid(), title: v.title, date: v.date, platform: v.platform,
          status: v.status, topicId: v.topicId || null
        }));
        rerender();
        return null;
      }
    });
  }

  function markPublished(s) {
    App.ui.modal({
      title: '标记已发布 · 顺手记个初始数据',
      values: { views: null, likes: null },
      fields: [
        { key: 'views', label: '播放量（选填）', type: 'number', min: 0 },
        { key: 'likes', label: '点赞数（选填）', type: 'number', min: 0 }
      ],
      submitText: '保存（可跳过）',
      onSubmit: function (v) {
        store.upsert('media.schedule', Object.assign({}, s, { status: '已发布' }));
        if (v.views != null || v.likes != null) {
          store.upsert('media.stats', { id: U.uid(), platform: s.platform, date: U.today(), views: v.views, likes: v.likes, fans: null });
        }
        var topic = store.data.media.topics.filter(function (t) { return t.id === s.topicId; })[0];
        if (topic && topic.status !== '已发布') {
          store.upsert('media.topics', Object.assign({}, topic, { status: '已发布' }));
        }
        rerender();
        return null;
      }
    });
  }

  function renderTopics(box) {
    var ui = App.ui;
    var add = D.el('<div class="row" style="margin-bottom:12px"><input class="input" placeholder="快速记一个选题灵感，回车添加"><button class="btn btn-primary">＋ 新选题</button></div>');
    var input = add.querySelector('input');
    function quick() {
      var t = input.value.trim();
      if (!t) return;
      store.upsert('media.topics', { id: U.uid(), title: t, desc: '', status: '灵感', note: '', createdAt: new Date().toISOString() });
      input.value = '';
      rerender();
    }
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') quick(); });
    add.querySelector('button').addEventListener('click', function () { topicModal(null); });
    box.appendChild(add);

    var filters = D.el('<div class="row" style="margin-bottom:12px"></div>');
    ['全部'].concat(TOPIC_STATUS).forEach(function (st) {
      var on = (TAB === 'topics:' + st) || (st === '全部' && TAB === 'topics');
      filters.appendChild(App.comp.capsule(st, { on: on, onClick: function () { TAB = st === '全部' ? 'topics' : 'topics:' + st; rerender(); } }));
    });
    box.appendChild(filters);

    var list = store.data.media.topics.slice().sort(function (a, b) { return (b.createdAt || '').localeCompare(a.createdAt || ''); });
    var cur = TAB.indexOf('topics:') === 0 ? TAB.slice(7) : null;
    if (cur) list = list.filter(function (t) { return t.status === cur; });
    if (!list.length) { box.appendChild(ui.emptyState('💡', '还没有选题，上面输入框记一个灵感', '＋ 新选题', function () { topicModal(null); })); return; }
    var grid = D.el('<div class="grid" style="grid-template-columns:repeat(3,1fr)"></div>');
    list.forEach(function (t) {
      var card = D.el('<div class="card" style="padding:12px 14px"><div class="row" style="justify-content:space-between"><b>' + U.esc(t.title) + '</b></div>' +
        (t.desc ? '<div class="muted small" style="margin:6px 0">' + U.esc(t.desc) + '</div>' : '<div style="height:6px"></div>') +
        '<div class="row small muted"><span class="tag">' + U.esc(t.status) + '</span><span>' + U.fmtDateCN((t.createdAt || '').slice(0, 10)) + '</span></div>' +
        '<div class="row mt8"></div></div>');
      var acts = card.querySelector('.row.mt8');
      acts.appendChild(App.comp.cycleCapsule(t.status, TOPIC_STATUS, function (ns) {
        store.upsert('media.topics', Object.assign({}, t, { status: ns }));
        rerender();
      }));
      acts.appendChild(App.comp.iconBtn('📅', '排入发布计划', function () {
        scheduleModal({ date: U.today(), platform: platforms()[0] || '', status: '计划中', title: t.title, topicId: t.id });
      }));
      acts.appendChild(App.comp.iconBtn('✏️', '编辑', function () { topicModal(t); }));
      acts.appendChild(App.comp.iconBtn('🗑', '删除', function () {
        ui.confirm({ title: '删除选题', text: '删除「' + t.title + '」？', danger: true }).then(function (ok) { if (ok) { store.remove('media.topics', t.id); rerender(); } });
      }));
      grid.appendChild(card);
    });
    box.appendChild(grid);
  }

  function renderSchedule(box) {
    var ui = App.ui;
    var head = D.el('<div class="row" style="justify-content:space-between;margin-bottom:12px"><div class="row"></div><button class="btn btn-primary">＋ 新发布计划</button></div>');
    head.querySelector('button').addEventListener('click', function () { scheduleModal(null); });
    var views = head.querySelector('.row');
    [['week', '本周'], ['month', '本月'], ['all', '全部'], ['done', '已发布']].forEach(function (v) {
      views.appendChild(App.comp.capsule(v[1], { on: VIEW === v[0], onClick: function () { VIEW = v[0]; rerender(); } }));
    });
    box.appendChild(head);

    var today = U.today();
    var mon = U.mondayOf(today);
    var list = store.data.media.schedule.slice().sort(U.byDateDesc);
    if (VIEW === 'week') list = list.filter(function (s) { return s.date >= mon && s.date <= U.addDays(mon, 6); });
    else if (VIEW === 'month') list = list.filter(function (s) { return U.monthOf(s.date) === U.monthOf(today); });
    else if (VIEW === 'done') list = list.filter(function (s) { return s.status === '已发布'; });

    if (!list.length) { box.appendChild(ui.emptyState('📅', '这个视图下还没有发布计划', '＋ 新发布计划', function () { scheduleModal(null); })); return; }
    var groups = U.groupBy(list, function (s) { return s.date; });
    groups.forEach(function (items, date) {
      box.appendChild(D.el('<div class="section-title" style="margin:10px 0 6px">' + U.fmtDateCN(date) + ' 周' + U.weekdayCN(date) + (date === today ? '（今天）' : '') + '</div>'));
      items.forEach(function (s) {
        var row = D.el('<div class="card row" style="padding:10px 14px;margin-bottom:8px">' +
          '<span class="tag">' + U.esc(s.platform || '未定平台') + '</span>' +
          '<span style="flex:1">' + U.esc(s.title) + '</span></div>');
        row.appendChild(App.comp.capsule(s.status, {
          on: s.status === '已发布',
          onClick: function () { if (s.status === '计划中') markPublished(s); else { store.upsert('media.schedule', Object.assign({}, s, { status: '计划中' })); rerender(); } }
        }));
        row.appendChild(App.comp.iconBtn('✏️', '编辑', function () { scheduleModal(s); }));
        row.appendChild(App.comp.iconBtn('🗑', '删除', function () {
          ui.confirm({ title: '删除发布计划', text: '删除「' + s.title + '」？', danger: true }).then(function (ok) { if (ok) { store.remove('media.schedule', s.id); rerender(); } });
        }));
        box.appendChild(row);
      });
    });
  }

  function renderStats(box) {
    var ui = App.ui;
    var head = D.el('<div class="row" style="justify-content:space-between;margin-bottom:12px"><div class="row">' +
      '<select class="select" style="width:110px"><option value="views">播放量</option><option value="likes">点赞数</option><option value="fans">粉丝数</option></select>' +
      '<select class="select" style="width:110px"><option value="30">近 30 天</option><option value="90">近 90 天</option><option value="all">全部</option></select>' +
      '</div><button class="btn btn-primary">＋ 录入数据</button></div>');
    var selM = head.querySelectorAll('select')[0], selR = head.querySelectorAll('select')[1];
    selM.value = METRIC; selR.value = RANGE;
    selM.addEventListener('change', function () { METRIC = selM.value; rerender(); });
    selR.addEventListener('change', function () { RANGE = selR.value; rerender(); });
    head.querySelector('button').addEventListener('click', function () { statModal(null); });
    box.appendChild(head);

    function statModal(s) {
      ui.modal({
        title: s ? '编辑数据记录' : '录入平台数据',
        values: s || { date: U.today(), platform: platforms()[0] || '' },
        fields: [
          { key: 'platform', label: '平台', type: 'select', options: platforms(), required: true },
          { key: 'date', label: '日期', type: 'date', required: true },
          { key: 'views', label: '播放量', type: 'number', min: 0 },
          { key: 'likes', label: '点赞数', type: 'number', min: 0 },
          { key: 'fans', label: '粉丝总数', type: 'number', min: 0 }
        ],
        onDelete: s ? function () { store.remove('media.stats', s.id); rerender(); } : null,
        onSubmit: function (v) {
          store.upsert('media.stats', Object.assign({}, s, { id: s ? s.id : U.uid(), platform: v.platform, date: v.date, views: v.views, likes: v.likes, fans: v.fans }));
          rerender();
          return null;
        }
      });
    }

    var today = U.today();
    var from = RANGE === 'all' ? '0000-00-00' : U.addDays(today, -(+RANGE - 1));
    var series = L.statsSeries(store.data.media.stats, METRIC, from, today);
    var chartBox = D.el('<div class="card"></div>');
    chartBox.innerHTML = App.charts.lineChart(series.map(function (s) { return { name: s.platform, points: s.points }; }), { from: RANGE === 'all' ? undefined : from, to: today });
    box.appendChild(chartBox);

    var recs = store.data.media.stats.slice().sort(U.byDateDesc);
    if (!recs.length) { box.appendChild(D.el('<div class="mt12"></div>')); box.lastChild.appendChild(ui.emptyState('📈', '还没有数据记录，点右上录入', null, null)); return; }
    var tbl = D.el('<table class="tbl mt12"><thead><tr><th>日期</th><th>平台</th><th>播放</th><th>点赞</th><th>粉丝</th><th></th></tr></thead><tbody></tbody></table>');
    var tb = tbl.querySelector('tbody');
    recs.forEach(function (r) {
      var tr = D.el('<tr><td>' + r.date + '</td><td>' + U.esc(r.platform) + '</td><td>' + (r.views == null ? '—' : r.views) + '</td><td>' + (r.likes == null ? '—' : r.likes) + '</td><td>' + (r.fans == null ? '—' : r.fans) + '</td><td></td></tr>');
      var td = tr.lastElementChild;
      td.appendChild(App.comp.iconBtn('✏️', '编辑', function () { statModal(r); }));
      td.appendChild(App.comp.iconBtn('🗑', '删除', function () {
        ui.confirm({ title: '删除记录', text: '删除 ' + r.date + ' ' + r.platform + ' 的数据？', danger: true }).then(function (ok) { if (ok) { store.remove('media.stats', r.id); rerender(); } });
      }));
      tb.appendChild(tr);
    });
    box.appendChild(tbl);
  }

  var viewEl = null;
  function rerender() { if (viewEl) render(viewEl, {}); }

  function render(view) {
    viewEl = view;
    App._view = view;
    view.innerHTML = '';
    view.appendChild(D.el('<h1 class="page-title">自媒体</h1><p class="page-sub">选题 → 排期 → 发布 → 数据</p>'));
    var tab = TAB.indexOf('topics') === 0 ? 'topics' : TAB;
    var tabs = App.ui.tabs([{ id: 'topics', label: '选题库' }, { id: 'schedule', label: '发布计划' }, { id: 'stats', label: '数据统计' }], tab, function (id) { TAB = id; rerender(); });
    view.appendChild(tabs);
    var box = D.el('<div></div>');
    view.appendChild(box);
    if (tab === 'topics') renderTopics(box);
    else if (tab === 'schedule') renderSchedule(box);
    else renderStats(box);
  }

  App.shell.registerPage('media', render);

  if (typeof module !== 'undefined' && module.exports) module.exports = (typeof globalThis !== 'undefined' ? globalThis : this).App;
});

</script>
<script>
/* ==== js/63-dev.js ==== */
/* 63-dev.js — 开发工作：四列看板（拖拽换状态）＋项目详情（进展记录时间线） */
(function (root, factory) {
  factory(root.App = root.App || {});
})(typeof globalThis !== 'undefined' ? globalThis : this, function (App) {
  'use strict';

  if (typeof document === 'undefined') {
    if (typeof module !== 'undefined' && module.exports) module.exports = (typeof globalThis !== 'undefined' ? globalThis : this).App;
    return;
  }

  var U = App.util, L = App.logic, D = App.dom, store = App.store;
  var COLS = ['未开始', '进行中', '暂停', '已完成'];
  var doneExpanded = false;
  var viewEl = null;
  function rerender() { if (viewEl) render(viewEl, {}); }

  function projectModal(p) {
    App.ui.modal({
      title: p ? '编辑项目：' + p.name : '新项目',
      wide: true,
      values: p || { status: '未开始', progress: 0 },
      fields: [
        { key: 'name', label: '项目名称', type: 'text', required: true },
        { key: 'status', label: '状态', type: 'select', options: COLS },
        { key: 'progress', label: '完成进度', type: 'slider', min: 0, max: 100, step: 5, unit: '%' },
        { key: 'nextStep', label: '下一步要做什么', type: 'text', placeholder: '一句话，回到项目时一眼看到' },
        { key: 'due', label: '截止日期（选填）', type: 'date' },
        { key: 'note', label: '备注', type: 'textarea', rows: 3 }
      ],
      onDelete: p ? function () {
        store.remove('dev.projects', p.id);
        rerender();
      } : null,
      onSubmit: function (v) {
        var old = p || { status: v.status, progress: v.progress, nextStep: '' };
        var changed = L.projectChangeLog(old, v);
        var logs = (p && p.logs ? p.logs.slice() : []);
        if (changed) logs.push({ time: new Date().toISOString(), text: changed, auto: true });
        store.upsert('dev.projects', {
          id: p ? p.id : U.uid(), name: v.name, status: v.status, progress: v.progress,
          nextStep: v.nextStep, note: v.note, due: v.due || null,
          updated: new Date().toISOString(), logs: logs
        });
        rerender();
        return null;
      }
    });
  }

  function detailModal(p) {
    var box = App.ui.modal({
      title: '项目详情：' + p.name,
      wide: true,
      values: p,
      fields: [
        { key: 'name', label: '项目名称', type: 'text', required: true },
        { key: 'status', label: '状态', type: 'select', options: COLS },
        { key: 'progress', label: '完成进度', type: 'slider', min: 0, max: 100, step: 5, unit: '%' },
        { key: 'nextStep', label: '下一步要做什么', type: 'text' },
        { key: 'due', label: '截止日期（选填）', type: 'date' },
        { key: 'note', label: '备注', type: 'textarea', rows: 3 }
      ],
      onDelete: function () {
        store.remove('dev.projects', p.id);
        rerender();
      },
      onSubmit: function (v) {
        var changed = L.projectChangeLog(p, v);
        var logs = p.logs.slice();
        if (changed) logs.push({ time: new Date().toISOString(), text: changed, auto: true });
        store.upsert('dev.projects', Object.assign({}, p, {
          name: v.name, status: v.status, progress: v.progress, nextStep: v.nextStep,
          note: v.note, due: v.due || null, updated: new Date().toISOString(), logs: logs
        }));
        rerender();
        return null;
      }
    });
    /* 进展记录时间线 + 手动补记：追加到弹窗内 */
    var mask = document.querySelector('#modal-root .modal-mask:last-child');
    if (mask) {
      var form = mask.querySelector('form');
      var sec = D.el('<div class="section-title" style="margin-top:6px">进展记录</div><div class="log-list" style="max-height:150px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:12px"></div>' +
        '<div class="row mt8"><input class="input" placeholder="手动补记一条进展…"><button type="button" class="btn btn-small">添加</button></div>');
      var listEl = sec.querySelector('.log-list');
      function drawLogs() {
        var cur = store.data.dev.projects.filter(function (x) { return x.id === p.id; })[0] || p;
        listEl.innerHTML = '';
        if (!cur.logs.length) listEl.appendChild(D.el('<div class="muted">暂无进展记录</div>'));
        cur.logs.slice().reverse().forEach(function (lg) {
          listEl.appendChild(D.el('<div style="padding:3px 0;border-bottom:1px dashed var(--border)"><span class="muted">' + U.esc(lg.time.slice(0, 16).replace('T', ' ')) + (lg.auto ? ' · 自动' : '') + '</span> ' + U.esc(lg.text) + '</div>'));
        });
      }
      drawLogs();
      sec.querySelector('button').addEventListener('click', function () {
        var input = sec.querySelector('input');
        var t = input.value.trim();
        if (!t) return;
        var cur = store.data.dev.projects.filter(function (x) { return x.id === p.id; })[0];
        if (!cur) return;
        var logs = cur.logs.slice();
        logs.push({ time: new Date().toISOString(), text: t, auto: false });
        store.upsert('dev.projects', Object.assign({}, cur, { logs: logs, updated: new Date().toISOString() }));
        input.value = '';
        drawLogs();
        rerender();
      });
      form.insertBefore(sec, form.querySelector('.modal-actions'));
    }
    return box;
  }

  function render(view) {
    viewEl = view;
    App._view = view;
    view.innerHTML = '';
    view.appendChild(D.el('<h1 class="page-title">开发工作</h1><p class="page-sub">拖拽卡片换列即改状态；点卡片看详情与进展记录</p>'));
    var head = D.el('<div class="row" style="justify-content:flex-end;margin-bottom:12px"><button class="btn btn-primary">＋ 新项目</button></div>');
    head.querySelector('button').addEventListener('click', function () { projectModal(null); });
    view.appendChild(head);

    var board = D.el('<div class="grid" style="grid-template-columns:repeat(4,1fr);align-items:start"></div>');
    var projects = store.data.dev.projects;
    COLS.forEach(function (col) {
      var items = projects.filter(function (p) { return p.status === col; })
        .sort(function (a, b) { return (b.updated || '').localeCompare(a.updated || ''); });
      var colEl = D.el('<div class="card" data-col="' + col + '" style="padding:10px;min-height:160px;background:var(--bg-soft)"></div>');
      var title = D.el('<div class="row" style="justify-content:space-between;margin-bottom:8px"><b class="small">' + col + '</b><span class="tag">' + items.length + '</span></div>');
      colEl.appendChild(title);
      if (col === '已完成' && !doneExpanded && items.length) {
        var toggle = D.el('<button class="btn btn-small btn-ghost">展开 ' + items.length + ' 个已完成项目 ▾</button>');
        toggle.addEventListener('click', function () { doneExpanded = true; rerender(); });
        colEl.appendChild(toggle);
        board.appendChild(colEl);
        return;
      }
      if (col === '已完成' && doneExpanded && items.length) {
        var fold = D.el('<button class="btn btn-small btn-ghost" style="margin-bottom:6px">收起 ▴</button>');
        fold.addEventListener('click', function () { doneExpanded = false; rerender(); });
        colEl.appendChild(fold);
      }
      if (!items.length) colEl.appendChild(D.el('<div class="muted small" style="text-align:center;padding:18px 0">空</div>'));
      items.forEach(function (p) {
        var card = D.el('<div class="card" draggable="true" data-drag-id="' + p.id + '" style="padding:10px 12px;margin-bottom:8px;cursor:grab;background:var(--bg-card)">' +
          '<b style="font-size:13px">' + U.esc(p.name) + '</b>' +
          '<div class="row mt8" style="gap:6px"><div style="flex:1;height:6px;border-radius:3px;background:var(--bg-hover);overflow:hidden"><div style="width:' + p.progress + '%;height:100%;background:var(--mod-color)"></div></div><span class="muted small">' + p.progress + '%</span></div>' +
          (p.nextStep ? '<div class="small" style="margin-top:6px">下一步：<b>' + U.esc(p.nextStep) + '</b></div>' : '') +
          '<div class="muted" style="font-size:10px;margin-top:6px">更新 ' + U.esc((p.updated || '').slice(0, 10)) + (p.due ? ' · 截止 ' + p.due : '') + '</div></div>');
        card.addEventListener('click', function (e) {
          if (e.target.closest('[draggable]') && card.dataset.justDragged) { card.dataset.justDragged = ''; return; }
          detailModal(p);
        });
        colEl.appendChild(card);
      });
      board.appendChild(colEl);
    });
    view.appendChild(board);

    App.comp.makeKanbanDraggable(board, function (id, status) {
      var p = store.data.dev.projects.filter(function (x) { return x.id === id; })[0];
      if (!p || p.status === status) return;
      var logs = p.logs.slice();
      logs.push({ time: new Date().toISOString(), text: '状态：' + p.status + ' → ' + status, auto: true });
      store.upsert('dev.projects', Object.assign({}, p, { status: status, updated: new Date().toISOString(), logs: logs }));
      rerender();
    });
    board.addEventListener('dragend', function () {
      board.querySelectorAll('[data-drag-id]').forEach(function (c) { c.dataset.justDragged = '1'; setTimeout(function () { delete c.dataset.justDragged; }, 50); });
    });
  }

  App.shell.registerPage('dev', render);

  if (typeof module !== 'undefined' && module.exports) module.exports = (typeof globalThis !== 'undefined' ? globalThis : this).App;
});

</script>
<script>
/* ==== js/64-consult.js ==== */
/* 64-consult.js — 咨询工作：收入/收款记录 ＋ 汇总卡 ＋ 月度柱状图 */
(function (root, factory) {
  factory(root.App = root.App || {});
})(typeof globalThis !== 'undefined' ? globalThis : this, function (App) {
  'use strict';

  if (typeof document === 'undefined') {
    if (typeof module !== 'undefined' && module.exports) module.exports = (typeof globalThis !== 'undefined' ? globalThis : this).App;
    return;
  }

  var U = App.util, L = App.logic, D = App.dom, store = App.store;
  var filterMonth = '';      // '' = 全部
  var onlyUnreceived = false;
  var viewEl = null;
  function rerender() { if (viewEl) render(viewEl, {}); }

  function incomeModal(r) {
    var clients = [];
    store.data.consult.incomes.forEach(function (i) { if (i.client && clients.indexOf(i.client) === -1) clients.push(i.client); });
    App.ui.modal({
      title: r ? '编辑收入记录' : '记一笔收入',
      values: r || { date: U.today(), received: false },
      fields: [
        { key: 'client', label: '客户', type: 'text', required: true, list: 'client-list' },
        { key: 'desc', label: '事项说明', type: 'text' },
        { key: 'amount', label: '金额（元）', type: 'number', required: true, min: 0 },
        { key: 'date', label: '日期', type: 'date', required: true },
        { key: 'received', label: '已收款', type: 'switch', onText: '已收到这笔钱' },
        { key: 'note', label: '备注', type: 'textarea', rows: 2 }
      ],
      onDelete: r ? function () { store.remove('consult.incomes', r.id); rerender(); } : null,
      onSubmit: function (v) {
        store.upsert('consult.incomes', Object.assign({}, r, {
          id: r ? r.id : U.uid(), client: v.client, desc: v.desc, amount: v.amount,
          date: v.date, received: v.received, note: v.note
        }));
        rerender();
        return null;
      }
    });
    /* datalist 供客户名联想 */
    if (clients.length && !document.getElementById('client-list')) {
      var dl = D.el('<datalist id="client-list">' + clients.map(function (c) { return '<option value="' + U.esc(c) + '">'; }).join('') + '</datalist>');
      document.body.appendChild(dl);
    }
  }

  function render(view) {
    viewEl = view;
    App._view = view;
    var ui = App.ui;
    var today = U.today();
    var incomes = store.data.consult.incomes;
    view.innerHTML = '';
    view.appendChild(D.el('<h1 class="page-title">咨询工作</h1><p class="page-sub">每笔收入记清楚：谁、多少钱、收没收到</p>'));

    /* 汇总卡 */
    var ms = L.incomeMonthSummary(incomes, U.monthOf(today));
    var yt = L.incomeYearTotal(incomes, today.slice(0, 4));
    var cards = D.el('<div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px"></div>');
    cards.appendChild(App.ui.statCard('本月已收', '¥' + U.fmtMoney(ms.received), '点击只看本月', function () { filterMonth = U.monthOf(today); onlyUnreceived = false; rerender(); }));
    cards.appendChild(App.ui.statCard('本月未收', '¥' + U.fmtMoney(ms.unreceived), ms.unreceivedCount + ' 笔 · 点击只看未收', function () { filterMonth = U.monthOf(today); onlyUnreceived = true; rerender(); }));
    cards.appendChild(App.ui.statCard('本年累计（已收）', '¥' + U.fmtMoney(yt), today.slice(0, 4) + ' 年', function () { filterMonth = ''; onlyUnreceived = false; rerender(); }));
    view.appendChild(cards);

    /* 筛选条 */
    var months = [];
    incomes.forEach(function (r) { var m = U.monthOf(r.date); if (m && months.indexOf(m) === -1) months.push(m); });
    months.sort().reverse();
    var bar = D.el('<div class="row" style="margin-bottom:12px">' +
      '<select class="select" style="width:140px"><option value="">全部月份</option>' + months.map(function (m) { return '<option value="' + m + '">' + m + '</option>'; }).join('') + '</select>' +
      '<label class="row small"><input type="checkbox"' + (onlyUnreceived ? ' checked' : '') + '> 只看未收</label>' +
      '<span class="spacer"></span><button class="btn btn-primary">＋ 记一笔</button></div>');
    var sel = bar.querySelector('select');
    sel.value = filterMonth;
    sel.addEventListener('change', function () { filterMonth = sel.value; rerender(); });
    bar.querySelector('input[type=checkbox]').addEventListener('change', function (e) { onlyUnreceived = e.target.checked; rerender(); });
    bar.querySelector('button').addEventListener('click', function () { incomeModal(null); });
    view.appendChild(bar);

    /* 柱状图 */
    var series = L.monthlyIncomeSeries(incomes, today, 6);
    var chart = D.el('<div class="card" style="margin-bottom:14px"></div>');
    chart.innerHTML = App.charts.barChart(series.map(function (m) {
      return { label: m.month.slice(5) + '月', parts: [{ value: m.received, color: 'var(--ok)', name: '已收' }, { value: m.unreceived, color: 'var(--warn-border)', name: '未收' }] };
    }), { yFmt: function (v) { return '¥' + Math.round(v); } });
    chart.addEventListener('click', function (e) {
      var t = e.target.closest('[data-idx]');
      if (!t) return;
      filterMonth = series[+t.dataset.idx].month;
      rerender();
    });
    view.appendChild(chart);

    /* 记录表 */
    var list = incomes.slice().sort(U.byDateDesc);
    if (filterMonth) list = list.filter(function (r) { return U.monthOf(r.date) === filterMonth; });
    if (onlyUnreceived) list = list.filter(function (r) { return !r.received; });
    if (!list.length) {
      view.appendChild(ui.emptyState('💰', '还没有收入记录', '＋ 记一笔', function () { incomeModal(null); }));
      return;
    }
    var tbl = D.el('<table class="tbl"><thead><tr><th>日期</th><th>客户</th><th>事项</th><th style="text-align:right">金额</th><th>状态</th><th></th></tr></thead><tbody></tbody></table>');
    var tb = tbl.querySelector('tbody');
    list.forEach(function (r) {
      var tr = D.el('<tr><td>' + r.date + '</td><td>' + U.esc(r.client) + '</td><td class="muted">' + U.esc(r.desc || '') + '</td>' +
        '<td style="text-align:right"><b>¥' + U.fmtMoney(r.amount) + '</b></td><td></td><td></td></tr>');
      var tdStatus = tr.children[4];
      tdStatus.appendChild(App.comp.capsule(r.received ? '已收' : '未收', {
        on: r.received,
        title: '点击切换收款状态',
        onClick: function () { store.upsert('consult.incomes', Object.assign({}, r, { received: !r.received })); rerender(); }
      }));
      var tdAct = tr.children[5];
      tdAct.appendChild(App.comp.iconBtn('✏️', '编辑', function () { incomeModal(r); }));
      tdAct.appendChild(App.comp.iconBtn('🗑', '删除', function () {
        ui.confirm({ title: '删除记录', text: '删除 ' + r.date + ' ' + r.client + ' ¥' + U.fmtMoney(r.amount) + '？', danger: true }).then(function (ok) { if (ok) { store.remove('consult.incomes', r.id); rerender(); } });
      }));
      tb.appendChild(tr);
    });
    view.appendChild(tbl);
  }

  App.shell.registerPage('consult', render);

  if (typeof module !== 'undefined' && module.exports) module.exports = (typeof globalThis !== 'undefined' ? globalThis : this).App;
});

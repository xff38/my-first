<script>
/* ==== js/65-study.js ==== */
/* 65-study.js — 学习计划：目标 │ 打卡 │ 时间表 │ 阅读清单 */
(function (root, factory) {
  factory(root.App = root.App || {});
})(typeof globalThis !== 'undefined' ? globalThis : this, function (App) {
  'use strict';

  if (typeof document === 'undefined') {
    if (typeof module !== 'undefined' && module.exports) module.exports = (typeof globalThis !== 'undefined' ? globalThis : this).App;
    return;
  }

  var U = App.util, L = App.logic, D = App.dom, store = App.store;
  var TAB = 'goals';
  var expandedGoals = {};
  var viewEl = null;
  function rerender() { if (viewEl) render(viewEl, {}); }

  function goalModal(g) {
    App.ui.modal({
      title: g ? '编辑目标' : '新目标',
      values: g || {},
      fields: [
        { key: 'title', label: '目标（如：毕业论文）', type: 'text', required: true },
        { key: 'due', label: '截止日期（选填）', type: 'date' }
      ],
      onDelete: g ? function () { store.remove('study.goals', g.id); rerender(); } : null,
      onSubmit: function (v) {
        store.upsert('study.goals', Object.assign({}, g, { id: g ? g.id : U.uid(), title: v.title, due: v.due || null, subtasks: g ? g.subtasks : [] }));
        rerender();
        return null;
      }
    });
  }

  function checkinModal(date) {
    var cur = store.data.study.checkins[date];
    App.ui.modal({
      title: (date === U.today() ? '今日' : U.fmtDateCN(date)) + '学习打卡',
      values: cur || { minutes: 60, note: '' },
      fields: [
        { key: 'minutes', label: '学习时长（分钟）', type: 'number', required: true, min: 0, max: 1440 },
        { key: 'note', label: '今天学了什么（选填）', type: 'text' }
      ],
      onDelete: cur ? function () { store.remove('study.checkins', date); rerender(); } : null,
      deleteText: '删除这天打卡记录？',
      onSubmit: function (v) {
        store.mapSet('study.checkins', date, { minutes: v.minutes, note: v.note });
        rerender();
        return null;
      }
    });
  }

  function renderGoals(box) {
    var ui = App.ui;
    var head = D.el('<div class="row" style="justify-content:flex-end;margin-bottom:12px"><button class="btn btn-primary">＋ 新目标</button></div>');
    head.querySelector('button').addEventListener('click', function () { goalModal(null); });
    box.appendChild(head);
    var goals = store.data.study.goals;
    if (!goals.length) { box.appendChild(ui.emptyState('🎯', '还没有学习目标，先立一个（比如毕业论文）', '＋ 新目标', function () { goalModal(null); })); return; }
    goals.forEach(function (g) {
      var prog = L.goalProgress(g);
      var card = D.el('<div class="card" style="margin-bottom:12px"></div>');
      var top = D.el('<div class="row" style="justify-content:space-between"><div><b>' + U.esc(g.title) + '</b>' + (g.due ? '<span class="muted small"> · 截止 ' + g.due + '</span>' : '') + '</div><span class="tag">' + prog + '%</span></div>');
      card.appendChild(top);
      card.appendChild(D.el('<div style="height:8px;border-radius:4px;background:var(--bg-hover);margin:8px 0;overflow:hidden"><div style="width:' + prog + '%;height:100%;background:var(--mod-color)"></div></div>'));
      var subBox = D.el('<div></div>');
      (g.subtasks || []).forEach(function (st) {
        var row = D.el('<div class="row small" style="padding:4px 0"><input type="checkbox"' + (st.done ? ' checked' : '') + '><span style="flex:1;' + (st.done ? 'text-decoration:line-through;opacity:.6' : '') + '">' + U.esc(st.text) + (st.due ? ' <span class="muted">(' + st.due + ')</span>' : '') + '</span></div>');
        row.querySelector('input').addEventListener('change', function (e) {
          var subs = g.subtasks.map(function (x) { return x.id === st.id ? Object.assign({}, x, { done: e.target.checked }) : x; });
          store.upsert('study.goals', Object.assign({}, g, { subtasks: subs }));
          rerender();
        });
        row.appendChild(App.comp.iconBtn('🗑', '删除子任务', function () {
          store.upsert('study.goals', Object.assign({}, g, { subtasks: g.subtasks.filter(function (x) { return x.id !== st.id; }) }));
          rerender();
        }));
        subBox.appendChild(row);
        /* 第二层检查项 */
        if (expandedGoals[g.id + ':' + st.id]) {
          var chkBox = D.el('<div style="margin-left:26px;border-left:2px solid var(--border);padding-left:10px"></div>');
          (st.checks || []).forEach(function (c, ci) {
            var cr = D.el('<div class="row small" style="padding:2px 0"><input type="checkbox"' + (c.done ? ' checked' : '') + '><span style="flex:1;' + (c.done ? 'opacity:.6' : '') + '">' + U.esc(c.text) + '</span></div>');
            cr.querySelector('input').addEventListener('change', function (e) {
              var subs = g.subtasks.map(function (x) {
                if (x.id !== st.id) return x;
                return Object.assign({}, x, { checks: x.checks.map(function (cc, i) { return i === ci ? Object.assign({}, cc, { done: e.target.checked }) : cc; }) });
              });
              store.upsert('study.goals', Object.assign({}, g, { subtasks: subs }));
              rerender();
            });
            chkBox.appendChild(cr);
          });
          var addChk = D.el('<div class="row small mt8"><input class="input" placeholder="＋检查项，回车添加" style="padding:3px 8px;font-size:12px"></div>');
          addChk.querySelector('input').addEventListener('keydown', function (e) {
            if (e.key !== 'Enter' || !e.target.value.trim()) return;
            var subs = g.subtasks.map(function (x) {
              if (x.id !== st.id) return x;
              return Object.assign({}, x, { checks: (x.checks || []).concat([{ text: e.target.value.trim(), done: false }]) });
            });
            store.upsert('study.goals', Object.assign({}, g, { subtasks: subs }));
            rerender();
          });
          chkBox.appendChild(addChk);
          subBox.appendChild(chkBox);
        }
        row.insertBefore(App.comp.iconBtn(expandedGoals[g.id + ':' + st.id] ? '▾' : '▸', '检查项', function () {
          expandedGoals[g.id + ':' + st.id] = !expandedGoals[g.id + ':' + st.id];
          rerender();
        }), row.lastElementChild);
      });
      card.appendChild(subBox);
      var addSub = D.el('<div class="row mt8"><input class="input" placeholder="＋子任务，回车添加"><button class="btn btn-small">添加</button></div>');
      function addSubFn() {
        var input = addSub.querySelector('input');
        var t = input.value.trim();
        if (!t) return;
        store.upsert('study.goals', Object.assign({}, g, { subtasks: (g.subtasks || []).concat([{ id: U.uid(), text: t, done: false, due: null, checks: [] }]) }));
        rerender();
      }
      addSub.querySelector('input').addEventListener('keydown', function (e) { if (e.key === 'Enter') addSubFn(); });
      addSub.querySelector('button').addEventListener('click', addSubFn);
      card.appendChild(addSub);
      var acts = D.el('<div class="row mt8"></div>');
      acts.appendChild(App.comp.iconBtn('✏️', '编辑目标', function () { goalModal(g); }));
      acts.appendChild(App.comp.iconBtn('🗑', '删除目标', function () {
        ui.confirm({ title: '删除目标', text: '删除「' + g.title + '」及其全部子任务？', danger: true }).then(function (ok) { if (ok) { store.remove('study.goals', g.id); rerender(); } });
      }));
      card.appendChild(acts);
      box.appendChild(card);
    });
  }

  function renderCheckin(box) {
    var ui = App.ui;
    var today = U.today();
    var data = store.data.study.checkins;
    var cur = data[today];
    var big = D.el('<div class="card" style="text-align:center;padding:22px;margin-bottom:14px"></div>');
    if (cur) {
      big.innerHTML = '<div style="font-size:15px">今天已打卡 ✅</div><div style="font-size:26px;font-weight:800;margin:6px 0">' + U.fmtMinutes(cur.minutes) + '</div>' +
        (cur.note ? '<div class="muted small">' + U.esc(cur.note) + '</div>' : '');
      var editBtn = D.el('<button class="btn mt12">修改今日记录</button>');
      editBtn.addEventListener('click', function () { checkinModal(today); });
      big.appendChild(editBtn);
    } else {
      big.innerHTML = '<div class="muted small">今天学习了吗？</div>';
      var btn = D.el('<button class="btn btn-primary" style="font-size:17px;padding:12px 34px;margin-top:10px">今日打卡</button>');
      btn.addEventListener('click', function () { checkinModal(today); });
      big.appendChild(btn);
    }
    box.appendChild(big);

    var mon = U.mondayOf(today);
    var cards = D.el('<div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px"></div>');
    cards.appendChild(App.ui.statCard('连续打卡', L.streakDays(data, today) + ' 天'));
    cards.appendChild(App.ui.statCard('本周总时长', U.fmtMinutes(L.checkinTotalMinutes(data, mon, U.addDays(mon, 6)))));
    cards.appendChild(App.ui.statCard('本月总时长', U.fmtMinutes(L.checkinTotalMinutes(data, U.monthOf(today) + '-01', U.monthOf(today) + '-31'))));
    box.appendChild(cards);

    var grid = L.heatGridDays(today, 8);
    var heat = D.el('<div class="card"><b class="small">近 8 周打卡热力（点格子查看/修改）</b><div class="mt8"></div></div>');
    var heatBox = heat.lastElementChild;
    heatBox.innerHTML = App.charts.heatGrid(grid.days, function (d) { return data[d] ? data[d].minutes : 0; }, {});
    heatBox.addEventListener('click', function (e) {
      var t = e.target.closest('[data-date]');
      if (t) checkinModal(t.dataset.date);
    });
    box.appendChild(heat);
  }

  function renderTimetable(box) {
    var ui = App.ui;
    var WD = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
    var COLORS = ['var(--c-home)', 'var(--c-plan)', 'var(--c-media)', 'var(--c-dev)', 'var(--c-study)', 'var(--c-diet)', 'var(--c-fun)', 'var(--c-consult)'];
    function ttModal(t, weekday) {
      ui.modal({
        title: t ? '编辑学习时段' : '添加学习时段',
        values: t || { weekday: weekday, start: '19:00', end: '21:00' },
        fields: [
          { key: 'weekday', label: '星期', type: 'select', options: WD.map(function (w, i) { return { value: i + 1, label: w }; }) },
          { key: 'start', label: '开始', type: 'time', required: true },
          { key: 'end', label: '结束', type: 'time', required: true, validate: function (v, vals) { return L.validateTimeRange(vals.start, v); } },
          { key: 'text', label: '学什么', type: 'text', required: true },
          { key: 'color', label: '颜色', type: 'select', options: [0, 1, 2, 3, 4, 5, 6, 7].map(function (i) { return { value: i, label: '颜色 ' + (i + 1) }; }) }
        ],
        onDelete: t ? function () { store.remove('study.timetable', t.id); rerender(); } : null,
        onSubmit: function (v) {
          store.upsert('study.timetable', Object.assign({}, t, { id: t ? t.id : U.uid(), weekday: +v.weekday, start: v.start, end: v.end, text: v.text, color: +v.color }));
          rerender();
          return null;
        }
      });
    }
    var grid = D.el('<div class="grid" style="grid-template-columns:repeat(7,1fr)"></div>');
    for (var wd = 1; wd <= 7; wd++) {
      var col = D.el('<div class="card" style="padding:8px;min-height:140px;background:var(--bg-soft)"></div>');
      var head = D.el('<div class="row" style="justify-content:space-between;margin-bottom:6px"><b class="small">' + WD[wd - 1] + '</b><button class="btn btn-ghost btn-small">＋</button></div>');
      (function (w) { head.querySelector('button').addEventListener('click', function () { ttModal(null, w); }); })(wd);
      col.appendChild(head);
      store.data.study.timetable.filter(function (t) { return t.weekday === wd; })
        .sort(function (a, b) { return a.start < b.start ? -1 : 1; })
        .forEach(function (t) {
          var chip = D.el('<div style="border-left:3px solid ' + COLORS[t.color % 8] + ';background:var(--bg-card);border-radius:6px;padding:4px 6px;margin-bottom:6px;font-size:12px;cursor:pointer">' +
            '<div class="muted">' + t.start + '–' + t.end + '</div><div>' + U.esc(t.text) + '</div></div>');
          chip.addEventListener('click', function () { ttModal(t); });
          col.appendChild(chip);
        });
      grid.appendChild(col);
    }
    box.appendChild(grid);
    box.appendChild(D.el('<div class="muted small mt8">点击格子条目编辑；时间表仅作计划展示，第一版不与打卡联动</div>'));
  }

  function renderReadings(box) {
    var ui = App.ui;
    var STATUS = ['想读', '在读', '读完'];
    function readModal(r) {
      ui.modal({
        title: r ? '编辑阅读条目' : '加入阅读清单',
        values: r || { type: '书籍', status: '想读' },
        fields: [
          { key: 'name', label: '书名 / 文献名 / 课程名', type: 'text', required: true },
          { key: 'type', label: '类型', type: 'select', options: ['书籍', '论文', '课程'] },
          { key: 'status', label: '状态', type: 'select', options: STATUS },
          { key: 'note', label: '我的笔记', type: 'textarea', rows: 4 }
        ],
        onDelete: r ? function () { store.remove('study.readings', r.id); rerender(); } : null,
        onSubmit: function (v) {
          var doneDate = r ? r.doneDate : null;
          if (v.status === '读完' && !doneDate) doneDate = U.today();
          if (v.status !== '读完') doneDate = null;
          store.upsert('study.readings', Object.assign({}, r, { id: r ? r.id : U.uid(), name: v.name, type: v.type, status: v.status, note: v.note, doneDate: doneDate }));
          rerender();
          return null;
        }
      });
    }
    var head = D.el('<div class="row" style="justify-content:flex-end;margin-bottom:12px"><button class="btn btn-primary">＋ 加入清单</button></div>');
    head.querySelector('button').addEventListener('click', function () { readModal(null); });
    box.appendChild(head);
    var list = store.data.study.readings;
    if (!list.length) { box.appendChild(ui.emptyState('📚', '阅读清单是空的', '＋ 加入清单', function () { readModal(null); })); return; }
    list.forEach(function (r) {
      var row = D.el('<div class="card row" style="padding:10px 14px;margin-bottom:8px">' +
        '<span class="tag">' + U.esc(r.type) + '</span><span style="flex:1"><b>' + U.esc(r.name) + '</b>' +
        (r.doneDate ? '<span class="muted small"> · 读完于 ' + r.doneDate + '</span>' : '') +
        (r.note ? '<div class="muted small" style="white-space:pre-wrap;margin-top:4px">' + U.esc(r.note) + '</div>' : '') + '</span></div>');
      row.appendChild(App.comp.cycleCapsule(r.status, STATUS, function (ns) {
        store.upsert('study.readings', Object.assign({}, r, { status: ns, doneDate: ns === '读完' ? (r.doneDate || U.today()) : null }));
        rerender();
      }));
      row.appendChild(App.comp.iconBtn('✏️', '编辑/写笔记', function () { readModal(r); }));
      row.appendChild(App.comp.iconBtn('🗑', '删除', function () {
        ui.confirm({ title: '删除', text: '从清单移除「' + r.name + '」？', danger: true }).then(function (ok) { if (ok) { store.remove('study.readings', r.id); rerender(); } });
      }));
      box.appendChild(row);
    });
  }

  function render(view) {
    viewEl = view;
    App._view = view;
    view.innerHTML = '';
    view.appendChild(D.el('<h1 class="page-title">学习计划</h1><p class="page-sub">目标拆解 · 每日打卡 · 固定时间表 · 阅读笔记</p>'));
    view.appendChild(App.ui.tabs([
      { id: 'goals', label: '目标' }, { id: 'checkin', label: '打卡' },
      { id: 'timetable', label: '时间表' }, { id: 'readings', label: '阅读清单' }
    ], TAB, function (id) { TAB = id; rerender(); }));
    var box = D.el('<div></div>');
    view.appendChild(box);
    if (TAB === 'goals') renderGoals(box);
    else if (TAB === 'checkin') renderCheckin(box);
    else if (TAB === 'timetable') renderTimetable(box);
    else renderReadings(box);
  }

  App.shell.registerPage('study', render);

  if (typeof module !== 'undefined' && module.exports) module.exports = (typeof globalThis !== 'undefined' ? globalThis : this).App;
});

</script>
<script>
/* ==== js/66-diet.js ==== */
/* 66-diet.js — 饮食计划：本周安排 │ 今日记录 │ 菜谱库 │ 体重 */
(function (root, factory) {
  factory(root.App = root.App || {});
})(typeof globalThis !== 'undefined' ? globalThis : this, function (App) {
  'use strict';

  if (typeof document === 'undefined') {
    if (typeof module !== 'undefined' && module.exports) module.exports = (typeof globalThis !== 'undefined' ? globalThis : this).App;
    return;
  }

  var U = App.util, L = App.logic, D = App.dom, store = App.store;
  var TAB = 'week';
  var weekMonday = U.mondayOf(U.today());
  var recordDate = U.today();
  var viewEl = null;
  function rerender() { if (viewEl) render(viewEl, {}); }
  var MEALS = [['breakfast', '早餐'], ['lunch', '午餐'], ['dinner', '晚餐']];

  function mealCellModal(date, mealKey, mealLabel) {
    var recipes = store.data.diet.recipes;
    var cur = (store.data.diet.meals[date] || {})[mealKey] || '';
    var matched = recipes.filter(function (r) { return r.name === cur; })[0];
    App.ui.modal({
      title: U.fmtDateCN(date) + ' ' + mealLabel,
      values: { pick: matched ? matched.id : '', free: matched ? '' : cur },
      fields: [
        { key: 'pick', label: '从菜谱库选', type: 'select', options: [{ value: '', label: '（手输内容）' }].concat(recipes.map(function (r) { return { value: r.id, label: r.name }; })) },
        { key: 'free', label: '或手动输入', type: 'text', placeholder: '如：楼下沙县' }
      ],
      onSubmit: function (v) {
        var text = v.free.trim();
        if (v.pick) {
          var r = recipes.filter(function (x) { return x.id === v.pick; })[0];
          if (r) text = r.name;
        }
        var day = Object.assign({ breakfast: '', lunch: '', dinner: '' }, store.data.diet.meals[date]);
        day[mealKey] = text;
        store.mapSet('diet.meals', date, day);
        rerender();
        return null;
      }
    });
  }

  function renderWeek(box) {
    var ui = App.ui;
    var nav = D.el('<div class="row" style="margin-bottom:12px"><button class="btn btn-small" data-a="prev">← 上周</button><button class="btn btn-small" data-a="cur">本周</button><button class="btn btn-small" data-a="next">下周 →</button><button class="btn btn-small" data-a="copy">复制上周</button><span class="muted small week-label"></span></div>');
    nav.querySelector('[data-a=prev]').addEventListener('click', function () { weekMonday = U.addDays(weekMonday, -7); rerender(); });
    nav.querySelector('[data-a=next]').addEventListener('click', function () { weekMonday = U.addDays(weekMonday, 7); rerender(); });
    nav.querySelector('[data-a=cur]').addEventListener('click', function () { weekMonday = U.mondayOf(U.today()); rerender(); });
    nav.querySelector('[data-a=copy]').addEventListener('click', function () {
      ui.confirm({ title: '复制上周', text: '把上周的餐食安排复制到本周（覆盖本周已有安排）？' }).then(function (ok) {
        if (!ok) return;
        var prevMon = U.addDays(weekMonday, -7);
        for (var i = 0; i < 7; i++) {
          var pd = U.addDays(prevMon, i), cd = U.addDays(weekMonday, i);
          var pv = store.data.diet.meals[pd];
          if (pv) store.mapSet('diet.meals', cd, Object.assign({}, pv));
        }
        rerender();
      });
    });
    nav.querySelector('.week-label').textContent = U.fmtDateCN(weekMonday) + ' – ' + U.fmtDateCN(U.addDays(weekMonday, 6));
    box.appendChild(nav);

    var today = U.today();
    var grid = D.el('<div class="grid" style="grid-template-columns:repeat(7,1fr)"></div>');
    for (var i = 0; i < 7; i++) {
      var date = U.addDays(weekMonday, i);
      var isToday = date === today;
      var col = D.el('<div class="card" style="padding:8px;' + (isToday ? 'border:2px solid var(--mod-color)' : '') + '"></div>');
      col.appendChild(D.el('<div class="small" style="font-weight:700;margin-bottom:6px">' + '一二三四五六日'.charAt(i) + ' ' + U.fmtDateCN(date) + (isToday ? ' ·今天' : '') + '</div>'));
      var day = store.data.diet.meals[date] || {};
      MEALS.forEach(function (m) {
        var cell = D.el('<div style="border:1px dashed var(--border);border-radius:6px;padding:4px 6px;margin-bottom:6px;font-size:12px;cursor:pointer;min-height:34px">' +
          '<div class="muted" style="font-size:10px">' + m[1] + '</div><div>' + (day[m[0]] ? U.esc(day[m[0]]) : '<span class="muted">—</span>') + '</div></div>');
        cell.addEventListener('click', function () { mealCellModal(date, m[0], m[1]); });
        col.appendChild(cell);
      });
      grid.appendChild(col);
    }
    box.appendChild(grid);
  }

  function renderRecords(box) {
    var nav = App.ui.dateNav(recordDate, function (d) { recordDate = d; rerender(); });
    box.appendChild(nav);
    var meals = store.data.diet.meals[recordDate] || {};
    var recs = store.data.diet.records[recordDate] || { breakfast: { actual: '', eaten: false }, lunch: { actual: '', eaten: false }, dinner: { actual: '', eaten: false } };
    var grid = D.el('<div class="grid" style="grid-template-columns:repeat(3,1fr)"></div>');
    MEALS.forEach(function (m) {
      var r = recs[m[0]] || { actual: '', eaten: false };
      var card = D.el('<div class="card"><b class="small">' + m[1] + '</b>' +
        '<div class="muted small mt8">计划：' + (meals[m[0]] ? U.esc(meals[m[0]]) : '未安排') + '</div>' +
        '<div class="form-row mt8"><label>实际吃了</label><input class="input actual" value="' + U.esc(r.actual) + '" placeholder="实际吃了什么"></div>' +
        '<label class="row small"><input type="checkbox" class="eaten"' + (r.eaten ? ' checked' : '') + '> 已吃 ✓</label></div>');
      function save() {
        var day = Object.assign({ breakfast: { actual: '', eaten: false }, lunch: { actual: '', eaten: false }, dinner: { actual: '', eaten: false } }, store.data.diet.records[recordDate]);
        day[m[0]] = { actual: card.querySelector('.actual').value, eaten: card.querySelector('.eaten').checked };
        store.mapSet('diet.records', recordDate, day);
      }
      card.querySelector('.actual').addEventListener('change', save);
      card.querySelector('.eaten').addEventListener('change', save);
      grid.appendChild(card);
    });
    box.appendChild(grid);
  }

  function recipeModal(r) {
    App.ui.modal({
      title: r ? '编辑菜谱' : '新菜谱',
      wide: true,
      values: r || { tags: (r && r.tags || []).join('、') },
      fields: [
        { key: 'name', label: '菜名', type: 'text', required: true },
        { key: 'tags', label: '标签（顿号分隔，如：主食、荤）', type: 'text', placeholder: (store.data.settings.recipeTags || []).join('、') },
        { key: 'ingredients', label: '食材清单', type: 'textarea', rows: 2 },
        { key: 'steps', label: '简单做法', type: 'textarea', rows: 4 }
      ],
      onDelete: r ? function () { store.remove('diet.recipes', r.id); rerender(); } : null,
      onSubmit: function (v) {
        var tags = String(v.tags || '').split(/[、,，]/).map(function (t) { return t.trim(); }).filter(Boolean);
        store.upsert('diet.recipes', Object.assign({}, r, { id: r ? r.id : U.uid(), name: v.name, tags: tags, ingredients: v.ingredients, steps: v.steps }));
        rerender();
        return null;
      }
    });
  }

  function renderRecipes(box) {
    var ui = App.ui;
    var head = D.el('<div class="row" style="justify-content:flex-end;margin-bottom:12px"><button class="btn btn-primary">＋ 新菜谱</button></div>');
    head.querySelector('button').addEventListener('click', function () { recipeModal(null); });
    box.appendChild(head);
    var list = store.data.diet.recipes;
    if (!list.length) { box.appendChild(ui.emptyState('🍳', '菜谱库是空的，先记一道常吃的', '＋ 新菜谱', function () { recipeModal(null); })); return; }
    var grid = D.el('<div class="grid" style="grid-template-columns:repeat(3,1fr)"></div>');
    list.forEach(function (r) {
      var card = D.el('<div class="card" style="padding:12px 14px"><b>' + U.esc(r.name) + '</b>' +
        '<div class="row mt8" style="gap:4px;flex-wrap:wrap">' + r.tags.map(function (t) { return '<span class="tag">' + U.esc(t) + '</span>'; }).join('') + '</div>' +
        (r.ingredients ? '<div class="muted small mt8">食材：' + U.esc(r.ingredients.slice(0, 60)) + '</div>' : '') +
        '<div class="row mt8"></div></div>');
      var acts = card.querySelector('.row.mt8');
      acts.appendChild(App.comp.iconBtn('📅', '排入本周', function () {
        ui.modal({
          title: '把「' + r.name + '」排到哪顿？',
          values: { date: U.today(), meal: 'lunch' },
          fields: [
            { key: 'date', label: '日期', type: 'date', required: true },
            { key: 'meal', label: '餐次', type: 'select', options: MEALS.map(function (m) { return { value: m[0], label: m[1] }; }) }
          ],
          onSubmit: function (v) {
            var day = Object.assign({ breakfast: '', lunch: '', dinner: '' }, store.data.diet.meals[v.date]);
            day[v.meal] = r.name;
            store.mapSet('diet.meals', v.date, day);
            rerender();
            return null;
          }
        });
      }));
      acts.appendChild(App.comp.iconBtn('✏️', '编辑', function () { recipeModal(r); }));
      acts.appendChild(App.comp.iconBtn('🗑', '删除', function () {
        ui.confirm({ title: '删除菜谱', text: '删除「' + r.name + '」？', danger: true }).then(function (ok) { if (ok) { store.remove('diet.recipes', r.id); rerender(); } });
      }));
      grid.appendChild(card);
    });
    box.appendChild(grid);
  }

  function renderWeight(box) {
    var ui = App.ui;
    function weightModal(w) {
      ui.modal({
        title: w ? '修改体重记录' : '记体重',
        values: w || { date: U.today() },
        fields: [
          { key: 'date', label: '日期', type: 'date', required: true },
          { key: 'kg', label: '体重（kg）', type: 'number', required: true, min: 20, max: 300 },
          { key: 'bf', label: '体脂率 %（选填）', type: 'number', min: 0, max: 80 }
        ],
        onDelete: w ? function () { store.remove('diet.weights', w.id); rerender(); } : null,
        onSubmit: function (v) {
          /* 同一天重复记录则覆盖 */
          var existing = w || store.data.diet.weights.filter(function (x) { return x.date === v.date; })[0];
          if (existing && !w) ui.toast('该日期已有记录，已覆盖', true);
          store.upsert('diet.weights', { id: existing ? existing.id : U.uid(), date: v.date, kg: v.kg, bf: v.bf });
          rerender();
          return null;
        }
      });
    }
    var head = D.el('<div class="row" style="justify-content:space-between;margin-bottom:12px"><div class="row">' +
      '<select class="select" style="width:110px"><option value="30">近 30 天</option><option value="90">近 90 天</option><option value="all">全部</option></select></div>' +
      '<button class="btn btn-primary">＋ 记一笔</button></div>');
    var sel = head.querySelector('select');
    var RANGE = '30';
    sel.addEventListener('change', function () { RANGE = sel.value; rerender(); });
    head.querySelector('button').addEventListener('click', function () { weightModal(null); });
    box.appendChild(head);

    var ws = L.weightSummary(store.data.diet.weights);
    if (ws) {
      var info = D.el('<div class="row" style="margin-bottom:10px">' +
        App.ui.statCard('最近体重', ws.latest.kg + ' kg', ws.latest.date).outerHTML +
        App.ui.statCard('较上次', (ws.change > 0 ? '+' : '') + ws.change.toFixed(1) + ' kg').outerHTML + '</div>');
      box.appendChild(info);
    }
    var today = U.today();
    var from = RANGE === 'all' ? '0000-00-00' : U.addDays(today, -(+RANGE - 1));
    var pts = store.data.diet.weights.filter(function (w) { return w.date >= from; }).sort(U.byDateAsc)
      .map(function (w) { return { date: w.date, value: w.kg }; });
    var chart = D.el('<div class="card"></div>');
    chart.innerHTML = App.charts.lineChart(pts.length ? [{ name: '体重(kg)', points: pts }] : [], { from: RANGE === 'all' ? undefined : from, to: today });
    box.appendChild(chart);

    var recs = store.data.diet.weights.slice().sort(U.byDateDesc);
    if (recs.length) {
      var tbl = D.el('<table class="tbl mt12"><thead><tr><th>日期</th><th>体重 kg</th><th>体脂 %</th><th></th></tr></thead><tbody></tbody></table>');
      var tb = tbl.querySelector('tbody');
      recs.forEach(function (w) {
        var tr = D.el('<tr><td>' + w.date + '</td><td>' + w.kg + '</td><td>' + (w.bf == null ? '—' : w.bf) + '</td><td></td></tr>');
        var td = tr.lastElementChild;
        td.appendChild(App.comp.iconBtn('✏️', '修改', function () { weightModal(w); }));
        td.appendChild(App.comp.iconBtn('🗑', '删除', function () {
          ui.confirm({ title: '删除记录', text: '删除 ' + w.date + ' 的体重记录？', danger: true }).then(function (ok) { if (ok) { store.remove('diet.weights', w.id); rerender(); } });
        }));
        tb.appendChild(tr);
      });
      box.appendChild(tbl);
    }
  }

  function render(view) {
    viewEl = view;
    App._view = view;
    view.innerHTML = '';
    view.appendChild(D.el('<h1 class="page-title">饮食计划</h1><p class="page-sub">排餐 · 记录 · 菜谱 · 体重</p>'));
    view.appendChild(App.ui.tabs([
      { id: 'week', label: '本周安排' }, { id: 'records', label: '今日记录' },
      { id: 'recipes', label: '菜谱库' }, { id: 'weight', label: '体重' }
    ], TAB, function (id) { TAB = id; rerender(); }));
    var box = D.el('<div></div>');
    view.appendChild(box);
    if (TAB === 'week') renderWeek(box);
    else if (TAB === 'records') renderRecords(box);
    else if (TAB === 'recipes') renderRecipes(box);
    else renderWeight(box);
  }

  App.shell.registerPage('diet', render);

  if (typeof module !== 'undefined' && module.exports) module.exports = (typeof globalThis !== 'undefined' ? globalThis : this).App;
});

</script>
<script>
/* ==== js/67-fun.js ==== */
/* 67-fun.js — 游戏娱乐：时间记录 │ 娱乐安排 │ 今天玩什么 */
(function (root, factory) {
  factory(root.App = root.App || {});
})(typeof globalThis !== 'undefined' ? globalThis : this, function (App) {
  'use strict';

  if (typeof document === 'undefined') {
    if (typeof module !== 'undefined' && module.exports) module.exports = (typeof globalThis !== 'undefined' ? globalThis : this).App;
    return;
  }

  var U = App.util, L = App.logic, D = App.dom, store = App.store;
  var TAB = 'records';
  var viewEl = null;
  var pickState = { spinning: false, result: null, skipped: [] };
  function rerender() { if (viewEl) render(viewEl, {}); }
  var WD = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
  var MOODS = { good: '😀', ok: '😐', bad: '😞' };

  function recordModal(r) {
    App.ui.modal({
      title: r ? '编辑娱乐记录' : '记一笔娱乐时间',
      values: r || { date: U.today(), minutes: 60 },
      fields: [
        { key: 'date', label: '日期', type: 'date', required: true },
        { key: 'what', label: '玩了/看了什么', type: 'text', required: true },
        { key: 'minutes', label: '时长（分钟）', type: 'number', required: true, min: 0, max: 1440 },
        { key: 'mood', label: '心情（选填）', type: 'select', options: [{ value: '', label: '（不记）' }, { value: 'good', label: '😀 开心' }, { value: 'ok', label: '😐 一般' }, { value: 'bad', label: '😞 不行' }] }
      ],
      onDelete: r ? function () { store.remove('fun.records', r.id); rerender(); } : null,
      onSubmit: function (v) {
        store.upsert('fun.records', Object.assign({}, r, { id: r ? r.id : U.uid(), date: v.date, what: v.what, minutes: v.minutes, mood: v.mood || null }));
        rerender();
        return null;
      }
    });
  }

  function weeklyModal(w) {
    App.ui.modal({
      title: w ? '编辑娱乐时段' : '添加每周固定娱乐',
      values: w || { weekday: 6, time: '20:00' },
      fields: [
        { key: 'weekday', label: '星期', type: 'select', options: WD.map(function (x, i) { return { value: i + 1, label: x }; }) },
        { key: 'time', label: '时间', type: 'time', required: true },
        { key: 'what', label: '内容（如：电影夜）', type: 'text', required: true }
      ],
      onDelete: w ? function () { store.remove('fun.weekly', w.id); rerender(); } : null,
      onSubmit: function (v) {
        store.upsert('fun.weekly', Object.assign({}, w, { id: w ? w.id : U.uid(), weekday: +v.weekday, time: v.time, what: v.what }));
        rerender();
        return null;
      }
    });
  }

  function renderRecords(box) {
    var ui = App.ui;
    var today = U.today();
    var recs = store.data.fun.records;
    var head = D.el('<div class="row" style="justify-content:flex-end;margin-bottom:12px"><button class="btn btn-primary">＋ 记一笔</button></div>');
    head.querySelector('button').addEventListener('click', function () { recordModal(null); });
    box.appendChild(head);
    var cards = D.el('<div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px"></div>');
    var wm = L.funWeekMinutes(recs, today), mm = L.funMonthMinutes(recs, today);
    var daysInMonth = +today.slice(8, 10);
    cards.appendChild(App.ui.statCard('本周合计', U.fmtMinutes(wm)));
    cards.appendChild(App.ui.statCard('本月合计', U.fmtMinutes(mm)));
    cards.appendChild(App.ui.statCard('本月日均', U.fmtMinutes(Math.round(mm / daysInMonth)), '和学习打卡对照看看平衡'));
    box.appendChild(cards);
    if (!recs.length) { box.appendChild(ui.emptyState('🎮', '还没有娱乐记录', '＋ 记一笔', function () { recordModal(null); })); return; }
    var tbl = D.el('<table class="tbl"><thead><tr><th>日期</th><th>内容</th><th>时长</th><th>心情</th><th></th></tr></thead><tbody></tbody></table>');
    var tb = tbl.querySelector('tbody');
    recs.slice().sort(U.byDateDesc).forEach(function (r) {
      var tr = D.el('<tr><td>' + r.date + '</td><td>' + U.esc(r.what) + '</td><td>' + U.fmtMinutes(r.minutes) + '</td><td>' + (r.mood ? MOODS[r.mood] : '—') + '</td><td></td></tr>');
      var td = tr.lastElementChild;
      td.appendChild(App.comp.iconBtn('✏️', '编辑', function () { recordModal(r); }));
      td.appendChild(App.comp.iconBtn('🗑', '删除', function () {
        ui.confirm({ title: '删除记录', text: '删除 ' + r.date + '「' + r.what + '」？', danger: true }).then(function (ok) { if (ok) { store.remove('fun.records', r.id); rerender(); } });
      }));
      tb.appendChild(tr);
    });
    box.appendChild(tbl);
  }

  function renderWeekly(box) {
    var ui = App.ui;
    var head = D.el('<div class="row" style="justify-content:flex-end;margin-bottom:12px"><button class="btn btn-primary">＋ 添加时段</button></div>');
    head.querySelector('button').addEventListener('click', function () { weeklyModal(null); });
    box.appendChild(head);
    var list = store.data.fun.weekly;
    if (!list.length) { box.appendChild(ui.emptyState('🗓', '还没有每周固定娱乐时段（如：周六晚电影夜）', '＋ 添加时段', function () { weeklyModal(null); })); return; }
    var grid = D.el('<div class="grid" style="grid-template-columns:repeat(7,1fr)"></div>');
    for (var wd = 1; wd <= 7; wd++) {
      var col = D.el('<div class="card" style="padding:8px;min-height:110px;background:var(--bg-soft)"><b class="small">' + WD[wd - 1] + '</b></div>');
      list.filter(function (w) { return w.weekday === wd; }).sort(function (a, b) { return a.time < b.time ? -1 : 1; }).forEach(function (w) {
        var chip = D.el('<div style="background:var(--bg-card);border-radius:6px;padding:4px 6px;margin-top:6px;font-size:12px;cursor:pointer"><div class="muted">' + w.time + '</div><div>' + U.esc(w.what) + '</div></div>');
        chip.addEventListener('click', function () { weeklyModal(w); });
        col.appendChild(chip);
      });
      grid.appendChild(col);
    }
    box.appendChild(grid);
    box.appendChild(D.el('<div class="muted small mt8">这些时段会自动进入「今天玩什么」的抽选池</div>'));
  }

  function renderPick(box) {
    var ui = App.ui;
    var pool = L.buildPickPool(store.data.fun.weekly, store.data.fun.pool);
    var card = D.el('<div class="card" style="text-align:center;padding:30px"></div>');
    var nameEl = D.el('<div style="font-size:30px;font-weight:800;min-height:44px" class="pick-name">—</div>');
    card.appendChild(D.el('<div class="muted small" style="margin-bottom:14px">抽选池共 ' + pool.length + ' 项（每周安排 ' + store.data.fun.weekly.length + ' ＋ 手动 ' + store.data.fun.pool.length + '）</div>'));
    card.appendChild(nameEl);
    var btns = D.el('<div class="row mt16" style="justify-content:center"></div>');
    var spinBtn = D.el('<button class="btn btn-primary" style="font-size:16px;padding:10px 30px">🎲 抽一个</button>');
    var okBtn = D.el('<button class="btn" disabled>就它了</button>');
    var againBtn = D.el('<button class="btn" disabled>不满意，重抽</button>');
    var skipBtn = D.el('<button class="btn" disabled>换一个（跳过）</button>');
    btns.appendChild(spinBtn); btns.appendChild(okBtn); btns.appendChild(againBtn); btns.appendChild(skipBtn);
    card.appendChild(btns);
    box.appendChild(card);

    function spin(exclude) {
      if (!pool.length) { ui.toast('抽选池是空的，先去「娱乐安排」或下面添加候选', true); return; }
      pickState.spinning = true;
      okBtn.disabled = againBtn.disabled = skipBtn.disabled = true;
      var ticks = 0, total = 14;
      var timer = setInterval(function () {
        var rnd = pool[Math.floor(Math.random() * pool.length)];
        nameEl.textContent = rnd.text;
        nameEl.style.opacity = ticks % 2 ? '.45' : '1';
        ticks++;
        if (ticks > total) {
          clearInterval(timer);
          var picked = L.randomPick(pool, exclude);
          pickState.result = picked;
          pickState.spinning = false;
          nameEl.textContent = picked ? picked.text : '（池空）';
          nameEl.style.opacity = '1';
          okBtn.disabled = againBtn.disabled = skipBtn.disabled = !picked;
        }
      }, 70);
    }
    spinBtn.addEventListener('click', function () { pickState.skipped = []; spin([]); });
    againBtn.addEventListener('click', function () { spin(pickState.skipped); });
    skipBtn.addEventListener('click', function () {
      if (pickState.result) pickState.skipped.push(pickState.result.id);
      spin(pickState.skipped);
    });
    okBtn.addEventListener('click', function () {
      var p = pickState.result;
      if (!p) return;
      store.upsert('fun.records', { id: U.uid(), date: U.today(), what: p.text, minutes: 0, mood: null });
      ui.toast('已预填一条今天的娱乐记录（' + p.text + '），时长可去「时间记录」补');
      pickState.result = null;
      rerender();
    });
    box.appendChild(card);

    /* 手动候选管理 */
    var mg = D.el('<div class="card mt16"><b class="small">手动候选池</b><div class="row mt8"><input class="input" placeholder="加一个候选，如：塞尔达、某部电影"><button class="btn btn-small btn-primary">添加</button></div><div class="row mt8" style="flex-wrap:wrap;gap:6px"></div></div>');
    var chips = mg.querySelector('.row.mt8');
    function addPool() {
      var input = mg.querySelector('input');
      var t = input.value.trim();
      if (!t) return;
      store.upsert('fun.pool', { id: U.uid(), text: t });
      input.value = '';
      rerender();
    }
    mg.querySelector('button').addEventListener('click', addPool);
    mg.querySelector('input').addEventListener('keydown', function (e) { if (e.key === 'Enter') addPool(); });
    store.data.fun.pool.forEach(function (p) {
      var chip = D.el('<span class="tag">' + U.esc(p.text) + '</span>');
      chip.appendChild(App.comp.iconBtn('✕', '移除候选', function () { store.remove('fun.pool', p.id); rerender(); }));
      chips.appendChild(chip);
    });
    if (!store.data.fun.pool.length) chips.appendChild(D.el('<span class="muted small">暂无手动候选</span>'));
    box.appendChild(mg);
  }

  function render(view) {
    viewEl = view;
    App._view = view;
    view.innerHTML = '';
    view.appendChild(D.el('<h1 class="page-title">游戏娱乐</h1><p class="page-sub">玩得开心，也留个痕迹</p>'));
    view.appendChild(App.ui.tabs([
      { id: 'records', label: '时间记录' }, { id: 'weekly', label: '娱乐安排' }, { id: 'pick', label: '今天玩什么' }
    ], TAB, function (id) { TAB = id; rerender(); }));
    var box = D.el('<div></div>');
    view.appendChild(box);
    if (TAB === 'records') renderRecords(box);
    else if (TAB === 'weekly') renderWeekly(box);
    else renderPick(box);
  }

  App.shell.registerPage('fun', render);

  if (typeof module !== 'undefined' && module.exports) module.exports = (typeof globalThis !== 'undefined' ? globalThis : this).App;
});

</script>
<script>
/* ==== js/68-settings.js ==== */
/* 68-settings.js — 数据与设置：数据文件管理、备份恢复、统计、个性化设置、危险操作、使用说明 */
(function (root, factory) {
  factory(root.App = root.App || {});
})(typeof globalThis !== 'undefined' ? globalThis : this, function (App) {
  'use strict';

  if (typeof document === 'undefined') {
    if (typeof module !== 'undefined' && module.exports) module.exports = (typeof globalThis !== 'undefined' ? globalThis : this).App;
    return;
  }

  var U = App.util, D = App.dom, store = App.store;
  var viewEl = null;
  function rerender() { if (viewEl) render(viewEl, {}); }

  function counts() {
    var d = store.data;
    return [
      ['备忘', d.memos.length],
      ['日程', d.plan.events.length],
      ['待办', d.plan.todos.length],
      ['每日回顾', Object.keys(d.plan.reviews).length],
      ['选题', d.media.topics.length],
      ['发布计划', d.media.schedule.length],
      ['平台数据', d.media.stats.length],
      ['开发项目', d.dev.projects.length],
      ['咨询收入', d.consult.incomes.length],
      ['学习目标', d.study.goals.length],
      ['学习打卡', Object.keys(d.study.checkins).length],
      ['学习时段', d.study.timetable.length],
      ['阅读条目', d.study.readings.length],
      ['菜谱', d.diet.recipes.length],
      ['餐食安排', Object.keys(d.diet.meals).length],
      ['饮食记录', Object.keys(d.diet.records).length],
      ['体重记录', d.diet.weights.length],
      ['娱乐记录', d.fun.records.length],
      ['娱乐时段', d.fun.weekly.length],
      ['抽选候选', d.fun.pool.length]
    ];
  }

  function tagManager(title, key) {
    var box = D.el('<div class="card"><b class="small">' + title + '</b><div class="row mt8" style="flex-wrap:wrap;gap:6px"></div>' +
      '<div class="row mt8"><input class="input" placeholder="添加一项，回车确认"><button class="btn btn-small">添加</button></div></div>');
    var chips = box.querySelector('.row.mt8');
    function draw() {
      chips.innerHTML = '';
      (store.data.settings[key] || []).forEach(function (t) {
        var chip = D.el('<span class="tag">' + U.esc(t) + '</span>');
        chip.appendChild(App.comp.iconBtn('✕', '删除', function () {
          store.setSetting(key, store.data.settings[key].filter(function (x) { return x !== t; }));
          rerender();
        }));
        chips.appendChild(chip);
      });
      if (!(store.data.settings[key] || []).length) chips.appendChild(D.el('<span class="muted small">空</span>'));
    }
    draw();
    function add() {
      var input = box.querySelector('input');
      var t = input.value.trim();
      if (!t) return;
      var list = store.data.settings[key] || [];
      if (list.indexOf(t) === -1) store.setSetting(key, list.concat([t]));
      input.value = '';
      rerender();
    }
    box.querySelector('button').addEventListener('click', add);
    box.querySelector('input').addEventListener('keydown', function (e) { if (e.key === 'Enter') add(); });
    return box;
  }

  function render(view) {
    viewEl = view;
    App._view = view;
    var ui = App.ui;
    var P = App.persist;
    view.innerHTML = '';
    view.appendChild(D.el('<h1 class="page-title">数据与设置</h1><p class="page-sub">你的数据在你自己硬盘上，这里管理它</p>'));

    /* 1 数据文件状态卡 */
    var connected = store.fileConnected();
    var json = JSON.stringify(store.data);
    var card = D.el('<div class="card">' +
      '<div class="row"><b>数据文件</b><span class="tag ' + (connected ? 'tag-on' : '') + '">' + (connected ? '已连接' : '未连接') + '</span></div>' +
      '<div class="muted small mt8">' + (connected ? '文件：' + U.esc(store.fileName()) : '尚未连接数据文件，当前修改暂存在浏览器缓存中') + '</div>' +
      '<div class="muted small">数据量约 ' + (json.length / 1024).toFixed(1) + ' KB · 最后保存 ' + U.esc((store.data.savedAt || '—').slice(0, 19).replace('T', ' ')) + '</div>' +
      '<div class="row mt12" style="flex-wrap:wrap">' +
      '<button class="btn btn-primary" data-a="connect">' + (connected ? '重新连接' : '连接数据文件') + '</button>' +
      '<button class="btn" data-a="create">新建数据文件</button>' +
      '<button class="btn" data-a="backup">立即备份</button>' +
      '<button class="btn" data-a="restore">恢复…</button>' +
      '</div><div class="muted small mt8">备份：有能力时自动写入数据文件旁的「备份」文件夹，否则通过浏览器下载保存（建议开启"下载前询问保存位置"）。</div></div>');
    card.querySelector('[data-a=connect]').addEventListener('click', function () { P.connect(); });
    card.querySelector('[data-a=create]').addEventListener('click', function () { P.createNew(); });
    card.querySelector('[data-a=backup]').addEventListener('click', function () { P.backup(); });
    card.querySelector('[data-a=restore]').addEventListener('click', function () { P.restore(); });
    view.appendChild(card);

    /* 2 数据统计 */
    view.appendChild(D.el('<div class="section-title">数据统计</div>'));
    var tbl = D.el('<table class="tbl"><thead><tr><th>模块数据</th><th style="text-align:right">条数</th></tr></thead><tbody></tbody></table>');
    var tb = tbl.querySelector('tbody');
    counts().forEach(function (c) {
      tb.appendChild(D.el('<tr><td>' + c[0] + '</td><td style="text-align:right"><b>' + c[1] + '</b></td></tr>'));
    });
    view.appendChild(tbl);

    /* 3 设置 */
    view.appendChild(D.el('<div class="section-title">设置</div>'));
    var setCard = D.el('<div class="card">' +
      '<div class="row"><span style="width:120px">主题</span><select class="select" style="width:140px" data-s="theme"><option value="light">浅色</option><option value="dark">深色</option></select></div>' +
      '<div class="row mt12"><span style="width:120px">侧边栏默认收起</span><label class="row small"><input type="checkbox" data-s="sidebar"> 是</label></div></div>');
    var selTheme = setCard.querySelector('[data-s=theme]');
    selTheme.value = store.data.settings.theme || 'light';
    selTheme.addEventListener('change', function () {
      store.setSetting('theme', selTheme.value);
      App.shell.applyTheme(selTheme.value);
    });
    var chkSb = setCard.querySelector('[data-s=sidebar]');
    chkSb.checked = !!store.data.settings.sidebarCollapsed;
    chkSb.addEventListener('change', function () {
      store.setSetting('sidebarCollapsed', chkSb.checked);
      App.shell.applySidebar(chkSb.checked);
    });
    view.appendChild(setCard);
    var mgrs = D.el('<div class="grid mt12" style="grid-template-columns:1fr 1fr"></div>');
    mgrs.appendChild(tagManager('自媒体平台（自媒体模块用）', 'platforms'));
    mgrs.appendChild(tagManager('菜谱标签（饮食模块用）', 'recipeTags'));
    view.appendChild(mgrs);

    /* 4 危险操作 */
    view.appendChild(D.el('<div class="section-title">危险操作</div>'));
    var danger = D.el('<div class="card" style="border-color:var(--danger)">' +
      '<div class="row" style="flex-wrap:wrap"><button class="btn" data-a="export">导出全部数据（下载 JSON）</button>' +
      '<button class="btn btn-danger" data-a="clear">清空全部数据</button></div>' +
      '<div class="muted small mt8">清空不可撤销（会要求输入确认文字）；清空前建议先导出或备份。</div></div>');
    danger.querySelector('[data-a=export]').addEventListener('click', function () { P.exportJSON(); });
    danger.querySelector('[data-a=clear]').addEventListener('click', function () {
      ui.confirm({
        title: '清空全部数据', danger: true, okText: '确认清空',
        text: '这将删除所有模块的全部数据（备忘、计划、收入、打卡……）。\n建议先点「导出全部数据」留底。',
        requireText: '确认清空'
      }).then(function (ok) { if (ok) { P.clearAll(); } });
    });
    view.appendChild(danger);

    /* 5 使用说明 */
    view.appendChild(D.el('<div class="section-title">使用说明</div>'));
    view.appendChild(D.el('<div class="card" style="line-height:1.9;font-size:13px">' +
      '<b>第一次使用</b>：点「新建数据文件」→ 选一个固定位置保存（建议就放在 APP 文件夹）→ 之后所有修改自动写入它。<br>' +
      '<b>每次打开</b>：双击 HTML 文件 → 点顶栏「● 未连接」或本页「连接数据文件」→ 选中你的数据文件（浏览器安全规则要求每次授权一次）。<br>' +
      '<b>忘了连接就改了数据？</b>：不会丢。修改暂存在浏览器里，连接文件后自动合并进去。<br>' +
      '<b>备份</b>：点「立即备份」生成带日期的副本；换电脑/换浏览器时，用「恢复…」选中备份文件即可完整迁移。<br>' +
      '<b>注意</b>：数据跟着"这个浏览器"走，请固定用一个浏览器打开本 App；清理浏览器缓存前请先备份。</div>'));
  }

  App.shell.registerPage('settings', render);

  if (typeof module !== 'undefined' && module.exports) module.exports = (typeof globalThis !== 'undefined' ? globalThis : this).App;
});

</script>
</body>
</html>

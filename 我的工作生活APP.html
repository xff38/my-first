<style>
/* ============ 基础与主题变量 ============ */
:root {
  --sidebar-w: 200px;
  --sidebar-w-collapsed: 56px;
  --topbar-h: 48px;
  --radius: 12px;
  --radius-sm: 8px;
  --font: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  /* 模块主题色 */
  --c-home: #4f7cff;
  --c-plan: #ff8c42;
  --c-media: #e85d9a;
  --c-dev: #22a06b;
  --c-consult: #d9a514;
  --c-study: #7a5cff;
  --c-diet: #2bb3c0;
  --c-fun: #f2555a;
  --c-set: #8a93a6;
}
html[data-theme="light"] {
  --bg: #f4f6fa;
  --bg-card: #ffffff;
  --bg-soft: #eef1f6;
  --bg-hover: #e8ecf4;
  --text: #23283a;
  --text-soft: #6b7386;
  --border: #dde3ee;
  --primary: #4f7cff;
  --primary-text: #ffffff;
  --danger: #e5484d;
  --warn-bg: #fff4d6;
  --warn-border: #f0d48a;
  --error-bg: #ffe0e0;
  --error-border: #f2a6a8;
  --ok: #22a06b;
  --shadow: 0 1px 3px rgba(20, 30, 60, .08), 0 4px 16px rgba(20, 30, 60, .06);
}
html[data-theme="dark"] {
  --bg: #16181f;
  --bg-card: #1f222c;
  --bg-soft: #262a36;
  --bg-hover: #2e3342;
  --text: #e7e9f0;
  --text-soft: #9aa1b3;
  --border: #343a4a;
  --primary: #6b91ff;
  --primary-text: #10131c;
  --danger: #ff6369;
  --warn-bg: #3a3220;
  --warn-border: #6b5a2e;
  --error-bg: #43262a;
  --error-border: #7c3a40;
  --ok: #37b580;
  --shadow: 0 1px 3px rgba(0, 0, 0, .4), 0 4px 16px rgba(0, 0, 0, .3);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  font-size: 14px;
  color: var(--text);
  background: var(--bg);
  overflow: hidden;
}
button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; font-size: 14px; color: var(--text); }
.spacer { flex: 1; }

/* ============ 横幅 ============ */
.banner {
  display: flex; align-items: center; gap: 10px; justify-content: center;
  padding: 8px 16px; font-size: 13px;
}
.banner-warn { background: var(--warn-bg); border-bottom: 1px solid var(--warn-border); }
.banner-error { background: var(--error-bg); border-bottom: 1px solid var(--error-border); }

/* ============ 布局 ============ */
#layout { display: flex; height: 100vh; }
body.has-banner #layout { height: calc(100vh - 35px); }

#sidebar {
  width: var(--sidebar-w); flex: none; display: flex; flex-direction: column;
  background: var(--bg-card); border-right: 1px solid var(--border);
  transition: width .15s ease;
}
#sidebar-head {
  height: var(--topbar-h); display: flex; align-items: center; gap: 8px;
  padding: 0 14px; border-bottom: 1px solid var(--border);
  font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden;
}
#nav { flex: 1; overflow-y: auto; padding: 8px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 9px 10px; margin-bottom: 2px; border: none; border-radius: var(--radius-sm);
  background: transparent; color: var(--text); font-size: 14px; text-align: left;
  white-space: nowrap; overflow: hidden;
}
.nav-item:hover { background: var(--bg-hover); }
.nav-item.active { background: var(--bg-soft); font-weight: 600; }
.nav-item .nav-icon { flex: none; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; }
.nav-item .nav-icon svg { width: 18px; height: 18px; }
.nav-item.active .nav-label { color: var(--mod-color, var(--primary)); }
#sidebar-toggle { margin: 8px; }
body.sidebar-collapsed #sidebar { width: var(--sidebar-w-collapsed); }
body.sidebar-collapsed #app-name,
body.sidebar-collapsed .nav-label { display: none; }
body.sidebar-collapsed .nav-item { justify-content: center; padding: 9px 0; }
body.sidebar-collapsed #sidebar-head { justify-content: center; padding: 0; }

#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#topbar {
  height: var(--topbar-h); flex: none; display: flex; align-items: center; gap: 12px;
  padding: 0 16px; background: var(--bg-card); border-bottom: 1px solid var(--border);
}
#top-date { font-size: 13px; color: var(--text-soft); }
.save-state { font-size: 12px; color: var(--text-soft); min-width: 64px; text-align: right; }
.save-state.ok { color: var(--ok); }
.save-state.err { color: var(--danger); font-weight: 600; }
.file-state {
  border: 1px solid var(--border); background: var(--bg-soft); border-radius: 999px;
  padding: 3px 12px; font-size: 12px; color: var(--text-soft);
}
.file-state-on { color: var(--ok); border-color: var(--ok); }
.file-state-off { color: #b58a00; border-color: var(--warn-border); background: var(--warn-bg); }
html[data-theme="dark"] .file-state-off { color: #e8c766; }

#view { flex: 1; overflow-y: auto; padding: 20px 24px; outline: none; }

/* ============ 通用基础件 ============ */
.btn {
  border: 1px solid var(--border); background: var(--bg-card); color: var(--text);
  border-radius: var(--radius-sm); padding: 7px 14px; font-size: 13px;
}
.btn:hover { background: var(--bg-hover); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-text); }
.btn-primary:hover { filter: brightness(1.06); background: var(--primary); }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-danger:hover { filter: brightness(1.08); background: var(--danger); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost:hover { background: var(--bg-hover); }
.btn-small { padding: 3px 10px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px;
}
.grid { display: grid; gap: 14px; }
.row { display: flex; gap: 12px; align-items: center; }
.muted { color: var(--text-soft); }
.small { font-size: 12px; }
.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; }
.page-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.page-sub { color: var(--text-soft); font-size: 13px; margin-bottom: 16px; }
.section-title { font-size: 15px; font-weight: 700; margin: 18px 0 10px; }

.tag {
  display: inline-block; padding: 2px 10px; border-radius: 999px;
  font-size: 12px; background: var(--bg-soft); color: var(--text-soft);
  border: 1px solid var(--border); cursor: default;
}
.tag.clickable { cursor: pointer; }
.tag-on { background: var(--primary); border-color: var(--primary); color: var(--primary-text); }

.input, .textarea, .select {
  width: 100%; border: 1px solid var(--border); background: var(--bg-card);
  border-radius: var(--radius-sm); padding: 7px 10px; color: var(--text);
}
.input:focus, .textarea:focus, .select:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
.input.invalid, .textarea.invalid { border-color: var(--danger); }
.field-error { color: var(--danger); font-size: 12px; margin-top: 3px; min-height: 14px; }
.textarea { resize: vertical; min-height: 64px; }

table.tbl { width: 100%; border-collapse: collapse; }
.tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; font-size: 13px; }
.tbl th { color: var(--text-soft); font-weight: 600; background: var(--bg-soft); }
.tbl tr:hover td { background: var(--bg-soft); }

.empty-state {
  text-align: center; color: var(--text-soft); padding: 36px 12px;
  border: 1.5px dashed var(--border); border-radius: var(--radius); background: var(--bg-card);
}
.empty-state .empty-icon { font-size: 30px; margin-bottom: 8px; }
.empty-state .btn { margin-top: 12px; }

/* 标签页 */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.tab-btn {
  border: none; background: transparent; color: var(--text-soft);
  padding: 9px 16px; font-size: 14px; border-bottom: 2.5px solid transparent; margin-bottom: -1px;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--mod-color, var(--primary)); border-bottom-color: var(--mod-color, var(--primary)); font-weight: 600; }

/* ============ 弹窗 ============ */
.modal-mask {
  position: fixed; inset: 0; background: rgba(10, 14, 26, .45);
  display: flex; align-items: flex-start; justify-content: center; z-index: 100;
  overflow-y: auto; padding: 6vh 16px 16px;
}
.modal {
  background: var(--bg-card); border-radius: var(--radius); box-shadow: var(--shadow);
  width: 460px; max-width: 100%; padding: 20px;
}
.modal.wide { width: 640px; }
.modal-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
.form-row { margin-bottom: 12px; }
.form-row label { display: block; font-size: 13px; color: var(--text-soft); margin-bottom: 5px; }
.form-row .required::after { content: " *"; color: var(--danger); }
.form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }

/* toast */
#toast-root { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast {
  background: var(--text); color: var(--bg-card); padding: 8px 18px;
  border-radius: 999px; font-size: 13px; box-shadow: var(--shadow);
  animation: toast-in .18s ease;
}
.toast.toast-err { background: var(--danger); color: #fff; }
@keyframes toast-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; } }

/* 滚动条 */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--text-soft); }

</style>

/* ==== js/00-util.js ==== */
/* 00-util.js — 纯工具函数（无 DOM 依赖，可在 Node 中测试） */
(function (root, factory) {
  factory(root.App = root.App || {});
})(typeof globalThis !== 'undefined' ? globalThis : this, function (App) {
  'use strict';

  var U = {};

  /* ---- ID ---- */
  U.uid = function () {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  };

  /* ---- 日期（一律本地时区，格式 YYYY-MM-DD） ---- */
  U.pad2 = function (n) { return (n < 10 ? '0' : '') + n; };

  U.toDateStr = function (d) {
    return d.getFullYear() + '-' + U.pad2(d.getMonth() + 1) + '-' + U.pad2(d.getDate());
  };

  U.today = function () { return U.toDateStr(new Date()); };

  U.parseDate = function (s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    if (!m) return null;
    var d = new Date(+m[1], +m[2] - 1, +m[3]);
    if (d.getFullYear() !== +m[1] || d.getMonth() !== +m[2] - 1 || d.getDate() !== +m[3]) return null;
    return d;
  };

  U.isValidDateStr = function (s) { return U.parseDate(s) !== null; };

  U.addDays = function (dateStr, n) {
    var d = U.parseDate(dateStr);
    if (!d) return null;
    d.setDate(d.getDate() + n);
    return U.toDateStr(d);
  };

  U.diffDays = function (a, b) { // b - a 的天数
    var da = U.parseDate(a), db = U.parseDate(b);
    if (!da || !db) return NaN;
    return Math.round((db - da) / 86400000);
  };

  U.weekdayCN = function (dateStr) {
    var d = U.parseDate(dateStr);
    if (!d) return '';
    return '日一二三四五六'.charAt(d.getDay());
  };

  /* 本周周一的日期 */
  U.mondayOf = function (dateStr) {
    var d = U.parseDate(dateStr);
    if (!d) return null;
    var wd = (d.getDay() + 6) % 7; // 周一=0
    d.setDate(d.getDate() - wd);
    return U.toDateStr(d);
  };

  U.monthOf = function (dateStr) { return (dateStr || '').slice(0, 7); }; // YYYY-MM

  U.fmtDateCN = function (dateStr) {
    var d = U.parseDate(dateStr);
    if (!d) return dateStr || '';
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  };

  U.greeting = function (hour) {
    if (hour == null) hour = new Date().getHours();
    if (hour < 6) return '夜深了';
    if (hour < 9) return '早上好';
    if (hour < 12) return '上午好';
    if (hour < 14) return '中午好';
    if (hour < 18) return '下午好';
    return '晚上好';
  };

  /* ---- 时间 HH:MM <-> 分钟 ---- */
  U.isValidTime = function (s) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(s || '');
    return !!m && +m[1] <= 23 && +m[2] <= 59;
  };
  U.timeToMin = function (s) {
    if (!U.isValidTime(s)) return NaN;
    var p = s.split(':');
    return (+p[0]) * 60 + (+p[1]);
  };
  U.minToTime = function (m) {
    m = Math.max(0, Math.min(24 * 60, Math.round(m)));
    return U.pad2(Math.floor(m / 60)) + ':' + U.pad2(m % 60);
  };
  U.fmtMinutes = function (mins) {
    mins = Math.max(0, Math.round(mins || 0));
    var h = Math.floor(mins / 60), m = mins % 60;
    if (h && m) return h + ' 小时 ' + m + ' 分';
    if (h) return h + ' 小时';
    return m + ' 分钟';
  };

  /* ---- 数字/金额 ---- */
  /* 严格解析：'12a' 这类脏输入视为非法（返回 dft），不做 parseFloat 的宽松前缀解析 */
  U.toNum = function (v, dft) {
    if (typeof v === 'number') return isFinite(v) ? v : (dft === undefined ? null : dft);
    var s = String(v == null ? '' : v).trim();
    if (!/^-?(\d+(\.\d*)?|\.\d+)$/.test(s)) return (dft === undefined ? null : dft);
    var n = parseFloat(s);
    return isFinite(n) ? n : (dft === undefined ? null : dft);
  };
  U.fmtMoney = function (n) {
    n = U.toNum(n, 0);
    return n.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  };

  /* ---- 杂项 ---- */
  U.clamp = function (v, lo, hi) { return Math.min(hi, Math.max(lo, v)); };

  U.debounce = function (fn, ms) {
    var t = null;
    var wrapped = function () {
      var args = arguments, self = this;
      if (t) clearTimeout(t);
      t = setTimeout(function () { t = null; fn.apply(self, args); }, ms);
    };
    wrapped.flush = function () { if (t) { clearTimeout(t); t = null; fn(); } };
    return wrapped;
  };

  U.deepClone = function (o) { return JSON.parse(JSON.stringify(o)); };

  U.esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  };

  U.nl2br = function (s) { return U.esc(s).replace(/\n/g, '<br>'); };

  /* 数组按 key 分组，保持出现顺序 */
  U.groupBy = function (arr, keyFn) {
    var map = new Map();
    (arr || []).forEach(function (it) {
      var k = keyFn(it);
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(it);
    });
    return map;
  };

  U.sum = function (arr, fn) {
    return (arr || []).reduce(function (a, b) { return a + (fn ? fn(b) : b); }, 0);
  };

  /* 备份文件名：我的数据-2026-11-13.json，冲突时加 -HHmmss */
  U.backupFileName = function (baseName, dateStr, usedNames, now) {
    now = now || new Date();
    var stem = (baseName || '数据').replace(/\.json$/i, '');
    var simple = stem + '-' + dateStr + '.json';
    if (!usedNames || usedNames.indexOf(simple) === -1) return simple;
    var t = U.pad2(now.getHours()) + U.pad2(now.getMinutes()) + U.pad2(now.getSeconds());
    return stem + '-' + dateStr + '-' + t + '.json';
  };

  U.byDateDesc = function (a, b) { return (b.date || '').localeCompare(a.date || ''); };
  U.byDateAsc = function (a, b) { return (a.date || '').localeCompare(b.date || ''); };

  App.util = U;

  if (typeof module !== 'undefined' && module.exports) module.exports = (typeof globalThis !== 'undefined' ? globalThis : this).App;

/* ==== js/20-logic.js ==== */
/* 20-logic.js — 纯业务逻辑：oplog、合并、顺延、统计摘要、校验（可 Node 测试） */

        var cleaned = S.cleanRecord(op.path, op.value);

        if (idx >= 0) arr[idx] = cleaned; else arr.push(cleaned);

        var map = S.ensurePath(data, op.path, {});
        var v = S.cleanMapValue(op.path, op.id, op.value);

  };

  /* ============ 自媒体：图表序列 ============ */
  /* 返回 [{platform, points:[{date, value}]}]，按日期升序，metric ∈ views/likes/fans */
  L.statsSeries = function (stats, metric, from, to) {
    var byPlatform = new Map();
    (stats || []).forEach(function (r) {
      if (r.date < from || r.date > to) return;
      var v = r[metric];
      if (v == null) return;
      if (!byPlatform.has(r.platform)) byPlatform.set(r.platform, []);
      byPlatform.get(r.platform).push({ date: r.date, value: v });
    });
    var out = [];
    byPlatform.forEach(function (points, platform) {
      points.sort(U.byDateAsc);
      out.push({ platform: platform, points: points });
    });
    out.sort(function (a, b) { return a.platform < b.platform ? -1 : (a.platform > b.platform ? 1 : 0); });

  };

  L.nextSchedule = function (schedule, today) {
    var future = (schedule || []).filter(function (s) { return s.status === '计划中' && s.date >= today; }).sort(U.byDateAsc);
    if (future.length) return future[0];
    var past = (schedule || []).slice().sort(U.byDateDesc);

  };

  /* ============ 开发：摘要 ============ */
  L.devSummary = function (projects) {
    var inProgress = (projects || []).filter(function (p) { return p.status === '进行中'; });
    var latest = (projects || []).slice().sort(function (a, b) { return (b.updated || '').localeCompare(a.updated || ''); })[0] || null;
    return { inProgressCount: inProgress.length, latestNextStep: latest ? (latest.nextStep || '') : '', latestName: latest ? latest.name : '' };
  };

  /* 项目更新时生成自动进展记录文本 */
  L.projectChangeLog = function (oldP, newP) {
    var parts = [];
    if (oldP.status !== newP.status) parts.push('状态：' + oldP.status + ' → ' + newP.status);
    if (oldP.progress !== newP.progress) parts.push('进度：' + oldP.progress + '% → ' + newP.progress + '%');
    if ((oldP.nextStep || '') !== (newP.nextStep || '')) parts.push('下一步：' + (newP.nextStep || '（空）'));
    return parts.join('；');
  };

  /* ============ 饮食/体重 ============ */
  L.weightSummary = function (weights) {
    var sorted = (weights || []).slice().sort(U.byDateAsc);
    if (!sorted.length) return null;
    var last = sorted[sorted.length - 1];
    var prev = sorted.length > 1 ? sorted[sorted.length - 2] : null;
    return { latest: last, change: prev ? (last.kg - prev.kg) : 0 };
  };

  L.dietTodayDone = function (records, today) {
    var r = records[today];
    if (!r) return 0;
    return ['breakfast', 'lunch', 'dinner'].filter(function (m) { return r[m] && r[m].eaten; }).length;
  };

  /* ============ 游戏娱乐 ============ */
  L.funWeekMinutes = function (funRecords, today) {
    var mon = U.mondayOf(today);
    var sun = U.addDays(mon, 6);
    return U.sum((funRecords || []).filter(function (r) { return r.date >= mon && r.date <= sun; }), function (r) { return r.minutes || 0; });
  };

  L.funMonthMinutes = function (funRecords, today) {
    var m = U.monthOf(today);
    return U.sum((funRecords || []).filter(function (r) { return U.monthOf(r.date) === m; }), function (r) { return r.minutes || 0; });
  };

  /* 抽选池 = 每周娱乐安排 + 手动 pool；随机抽一个，可排除若干 id */
  L.buildPickPool = function (weekly, pool) {
    var items = [];
    (weekly || []).forEach(function (w) { items.push({ id: w.id, text: w.what, src: 'weekly' }); });
    (pool || []).forEach(function (p) { items.push({ id: p.id, text: p.text, src: 'pool' }); });
    return items;
  };

  L.randomPick = function (items, excludeIds, rand) {
    var r = rand || Math.random;
    var avail = (items || []).filter(function (it) { return !(excludeIds || []).includes(it.id); });
    if (!avail.length) avail = items || [];
    if (!avail.length) return null;
    return avail[Math.floor(r() * avail.length) % avail.length];
  };

  /* ============ 今日计划摘要 ============ */
  L.planSummary = function (data, today) {
    var todos = data.plan.todos.filter(function (t) { return t.date === today; });
    var events = data.plan.events.filter(function (e) { return e.date === today; });
    return {
      todoTotal: todos.length,
      todoDone: todos.filter(function (t) { return t.done; }).length,
      eventCount: events.length
    };
  };

  /* ============ 校验 ============ */
  L.validateRequired = function (v, label) {
    return (v == null || String(v).trim() === '') ? (label + '不能为空') : null;
  };
  L.validateNumber = function (v, label, opts) {
    opts = opts || {};
    if (v === '' || v == null) return opts.required ? (label + '不能为空') : null;
    var n = U.toNum(v, null);
    if (n === null) return label + '必须是数字';
    if (opts.min != null && n < opts.min) return label + '不能小于 ' + opts.min;
    if (opts.max != null && n > opts.max) return label + '不能大于 ' + opts.max;
    return null;
  };
  L.validateTimeRange = function (start, end) {
    if (!U.isValidTime(start)) return '开始时间格式应为 HH:MM';
    if (!U.isValidTime(end)) return '结束时间格式应为 HH:MM';
    if (U.timeToMin(end) <= U.timeToMin(start)) return '结束时间必须晚于开始时间';
    return null;
  };
  /* 日程重叠检测：返回与 [start,end) 重叠的其他日程数量 */
  L.countOverlaps = function (events, date, start, end, excludeId) {
    var s = U.timeToMin(start), e = U.timeToMin(end);
    return (events || []).filter(function (ev) {
      return ev.date === date && ev.id !== excludeId &&
        U.timeToMin(ev.start) < e && s < U.timeToMin(ev.end);
    }).length;
  };

  App.logic = L;

  if (typeof module !== 'undefined' && module.exports) module.exports = (typeof globalThis !== 'undefined' ? globalThis : this).App;
});

/* ==== js/30-store.js ==== */
/* 30-store.js — 内存 store + 变更 API + 自动保存管道（适配器注入，可 Node 测试） */
(function (root, factory) {
  factory(root.App = root.App || {});
})(typeof globalThis !== 'undefined' ? globalThis : this, function (App) {
  'use strict';

  var U = App.util, S = App.schema, L = App.logic;

  function createStore() {
    var data = S.defaultData();
    var subs = [];
    var fileAdapter = null;   // {isConnected(), name(), write(json):Promise|void}
    var cacheAdapter = null;  // {saveSnapshot(json), pushOps(ops), loadOps(), clearOps(), saveMeta(obj), loadMeta(), loadSnapshot()}
    var pendingOps = [];      // 未落盘到文件的操作日志
    var saveState = 'idle';   // idle | saved | cache | error
    var lastError = null;

    var store = {};

    Object.defineProperty(store, 'data', { get: function () { return data; } });
    store.pendingOps = function () { return pendingOps.slice(); };
    store.saveState = function () { return saveState; };
    store.lastError = function () { return lastError; };

    store.setFileAdapter = function (a) { fileAdapter = a; };
    store.setCacheAdapter = function (a) { cacheAdapter = a; };
    store.fileConnected = function () { return !!(fileAdapter && fileAdapter.isConnected()); };
    store.fileName = function () { return (fileAdapter && fileAdapter.name()) || ''; };

    store.subscribe = function (fn) { subs.push(fn); };
    store.notify = function () {
      subs.forEach(function (fn) {
        try { fn(data); } catch (e) { if (typeof console !== 'undefined') console.error(e); }
      });
    };

    function setSaveStateUI(state, errText) {
      saveState = state;
      lastError = errText || null;
      if (typeof document !== 'undefined' && App.shell) {
        if (state === 'saved') App.shell.setSaveState('已保存 ✓', 'ok');
        else if (state === 'cache') App.shell.setSaveState('暂存浏览器', '');
        else if (state === 'error') App.shell.setSaveState('保存失败 ⚠', 'err');
        else App.shell.setSaveState('—', '');
        App.shell.setFileState(store.fileConnected(), store.fileName());
      }
    }
    store.setSaveStateUI = setSaveStateUI;

    /* ---- 变更 API（全部经过这里，自动记 op） ---- */
    function pushOp(op) {
      pendingOps.push(op);
      if (pendingOps.length > 5000) pendingOps = pendingOps.slice(-4000);
    }

    store.upsert = function (path, record) {
      var cleaned = S.cleanRecord(path, record);
      if (!cleaned) return null;
      var arr = S.ensurePath(data, path, []);
      var idx = -1;
      for (var i = 0; i < arr.length; i++) if (arr[i].id === cleaned.id) { idx = i; break; }
      if (idx >= 0) arr[idx] = cleaned; else arr.push(cleaned);
      pushOp(L.opUpsert(path, cleaned));
      store.commit();
      return cleaned;
    };

    store.mapSet = function (path, key, value) {
      var cleaned = S.cleanMapValue(path, key, value);
      var map = S.ensurePath(data, path, {});
      if (cleaned === undefined) {
        /* 清洗后为空（如清空回顾）= 删除该键 */
        if (Object.prototype.hasOwnProperty.call(map, key)) {
          delete map[key];
          pushOp(L.opRemove(path, key));
          store.commit();
        }
        return false;
      }
      map[key] = cleaned;
      pushOp(L.opMapSet(path, key, cleaned));
      store.commit();
      return true;
    };

    store.remove = function (path, id) {
      var kind = S.COLLECTIONS[path];
      if (kind === 'array') {
        var arr = S.ensurePath(data, path, []);
        for (var i = arr.length - 1; i >= 0; i--) if (arr[i].id === id) arr.splice(i, 1);
      } else if (kind === 'map') {
        delete S.ensurePath(data, path, {})[id];
      }
      pushOp(L.opRemove(path, id));
      store.commit();
    };

    store.setSetting = function (key, value) {
      data.settings[key] = (value && typeof value === 'object') ? U.deepClone(value) : value;
      pushOp(L.opSetting(key, data.settings[key]));

    };

    /* 整体替换数据（连接文件/恢复/清空时用）：skipOps=不记 op */
    store.setData = function (newData) {
      data = S.normalize(newData) || S.defaultData();
      store.commit();
    };

    store.commit = function () {
      store.notify();
      store.queueSave();
    };

    /* ---- 保存管道 ---- */
    store.saveNow = function () {
      var json = S.serialize(data);
      /* 快照缓存始终写（应急兜底） */
      if (cacheAdapter) {
        try {
          cacheAdapter.saveSnapshot(json);
          if (pendingOps.length) cacheAdapter.pushOps(pendingOps.slice());
        } catch (e) { /* 缓存失败不阻塞 */ }
      }
      if (fileAdapter && fileAdapter.isConnected()) {
        var done = function (err) {
          if (err) {
            setSaveStateUI('error', String(err && err.message || err));
            if (cacheAdapter) { try { cacheAdapter.pushOps(pendingOps.slice()); } catch (e2) {} }
          } else {
            pendingOps = [];
            if (cacheAdapter) { try { cacheAdapter.clearOps(); } catch (e2) {} }
            setSaveStateUI('saved');
          }
        };
        try {
          var r = fileAdapter.write(json);
          if (r && typeof r.then === 'function') r.then(function () { done(null); }, function (e) { done(e); });
          else done(null);
        } catch (e) { done(e); }
      } else {
        setSaveStateUI('cache');
      }
    };

    store.queueSave = U.debounce(store.saveNow, 500);

    /* 清空未决 op（连接文件重放成功后由 persist 调用） */
    store.takePendingOps = function () {
      var ops = pendingOps.slice();
      pendingOps = [];
      if (cacheAdapter) { try { cacheAdapter.clearOps(); } catch (e) {} }
      return ops;
    };
    store.restorePendingOps = function (ops) { pendingOps = ops.slice(); };

    /* 启动：从缓存恢复（未连接文件时的暂存数据） */
    store.loadFromCache = function () {
      if (!cacheAdapter) return false;
      var snap = null;
      try { snap = cacheAdapter.loadSnapshot(); } catch (e) {}

        var norm = S.normalize(snap);
        if (norm) data = norm;

      var ops = [];
      try { ops = cacheAdapter.loadOps() || []; } catch (e) {}
      pendingOps = ops.slice();
      if (pendingOps.length) L.applyOplog(data, pendingOps);
      return true;
    };

    return store;
  }

  App.createStore = createStore;
  if (typeof document !== 'undefined' || !App.store) {
    App.store = App.store || createStore();
  }

  if (typeof module !== 'undefined' && module.exports) module.exports = (typeof globalThis !== 'undefined' ? globalThis : this).App;
});

<script>
/* ==== js/40-persist.js ==== */
/* 40-persist.js — 浏览器持久化层：IndexedDB 句柄、FSA 文件连接、localStorage 缓存、备份/恢复/导出/清空 */
(function (root, factory) {
  factory(root.App = root.App || {});
})(typeof globalThis !== 'undefined' ? globalThis : this, function (App) {
  'use strict';

  var U = App.util, S = App.schema, L = App.logic;

  var caps = {
    open: typeof window !== 'undefined' && typeof window.showOpenFilePicker === 'function',
    save: typeof window !== 'undefined' && typeof window.showSaveFilePicker === 'function',
    dir: typeof window !== 'undefined' && typeof window.showDirectoryPicker === 'function'
  };

  var P = { caps: caps };

  if (typeof window === 'undefined') {
    App.persist = P; // Node 环境：仅暴露能力标志，供测试引用
    if (typeof module !== 'undefined' && module.exports) module.exports = globalThis.App;
    return;
  }

  var store = App.store;
  var ui = function () {
    return App.ui || {
      toast: function (m) { console.log('[toast] ' + m); },
      confirm: function (m) { return window.confirm(m); },
      alert: function (m) { window.alert(m); }
    };
  };

  /* ============ localStorage 缓存适配器 ============ */
  var LS_SNAP = 'papp.snap', LS_OPS = 'papp.ops', LS_BACKUPS = 'papp.backupNames';
  var cacheAdapter = {
    saveSnapshot: function (json) { try { localStorage.setItem(LS_SNAP, json); } catch (e) {} },
    loadSnapshot: function () { try { return localStorage.getItem(LS_SNAP); } catch (e) { return null; } },
    pushOps: function (ops) { try { localStorage.setItem(LS_OPS, JSON.stringify(ops)); } catch (e) {} }, // 语义=整体替换为当前全部未决 ops
    loadOps: function () { try { return JSON.parse(localStorage.getItem(LS_OPS) || '[]'); } catch (e) { return []; } },
    clearOps: function () { try { localStorage.removeItem(LS_OPS); } catch (e) {} }
  };

  /* ============ IndexedDB（存文件句柄） ============ */
  function idb() {
    return new Promise(function (res, rej) {
      var req = indexedDB.open('papp-db', 1);
      req.onupgradeneeded = function () {
        if (!req.result.objectStoreNames.contains('kv')) req.result.createObjectStore('kv');
      };
      req.onsuccess = function () { res(req.result); };
      req.onerror = function () { rej(req.error); };
    });
  }
  function idbGet(key) {
    return idb().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction('kv', 'readonly');
        var r = tx.objectStore('kv').get(key);
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { rej(r.error); };
      });
    });
  }
  function idbSet(key, val) {
    return idb().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(val, key);
        tx.oncomplete = function () { res(true); };
        tx.onerror = function () { rej(tx.error); };

    }).catch(function () { return false; });

      isConnected: function () { return !!handle; },
      name: function () { return handle ? handle.name : ''; },
      write: function (json) {
        return handle.createWritable().then(function (w) {
          return w.write(json).then(function () { return w.close(); });
        });
      }
    };
  }

  async function ensurePermission(handle) {
    var opts = { mode: 'readwrite' };
    if ((await handle.queryPermission(opts)) === 'granted') return true;
    return (await handle.requestPermission(opts)) === 'granted';
  }

  async function readHandleText(handle) {
    var f = await handle.getFile();
    return await f.text();
  }

  /* 连接成功后的通用流程：读文件 → normalize → 重放 oplog → 写回 */
  async function adoptHandle(handle, opts) {
    opts = opts || {};
    if (!(await ensurePermission(handle))) throw new Error('未获得文件读写授权');
    var text = await readHandleText(handle);
    var fileData = S.normalize(text);
    if (fileData === null) {
      /* 文件内容无法识别 */
      if (!opts.forceOverwrite && !ui().confirm('文件「' + handle.name + '」内容无法识别（不是本 App 的数据格式）。\n是否用当前数据覆盖它？\n（选"取消"则不连接）')) {
        throw new Error('文件内容无法识别');
      }
      fileData = S.normalize(store.data);
    }
    var ops = store.pendingOps();
    if (ops.length) {
      L.applyOplog(fileData, ops);
    }
    fileHandle = handle;
    store.setFileAdapter(makeFileAdapter(handle));
    store.setData(fileData);       // setData→commit→queueSave（合并结果随后写回文件）
    var carried = L.carryOverTodos(store.data, U.today());
    if (carried) store.commit();
    store.saveNow();               // 立即写一次，成功后清空 pendingOps
    idbSet('fileHandle', handle);
    App.shell.setFileState(true, handle.name);
    if (App.shell.rerender) App.shell.rerender();
    return handle.name;
  }

  /* 用户点击「连接数据文件」 */
  P.connect = async function () {
    try {
      /* 1) 优先用记住的句柄 */
      var saved = await idbGet('fileHandle').catch(function () { return null; });
      if (saved) {
        try {
          var name = await adoptHandle(saved);
          ui().toast('已连接：' + name);
          return name;
        } catch (e) { /* 句柄失效则走选择器 */ }
      }
      /* 2) 文件选择器 */
      if (!caps.open) { ui().alert('当前浏览器不支持连接本地文件，请使用「导出/导入」管理数据。'); return null; }
      var [h] = await window.showOpenFilePicker({
        mode: 'readwrite',
        types: [{ description: '数据文件', accept: { 'application/json': ['.json'], 'text/plain': ['.txt'] } }],
        multiple: false
      });
      var name2 = await adoptHandle(h);
      ui().toast('已连接：' + name2);
      return name2;
    } catch (e) {
      if (e && e.name === 'AbortError') return null; // 用户取消
      ui().toast('连接失败：' + (e && e.message || e), true);
      return null;
    }
  };

  /* ============ 下载兜底 ============ */
  function downloadBlob(filename, text) {
    var blob = new Blob([text], { type: 'application/json;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  }
  P.downloadBlob = downloadBlob;

  /* ============ 新建数据文件 ============ */
  P.createNew = async function () {
    var json = S.serialize(store.data);
    if (caps.save) {
      try {
        var handle = await window.showSaveFilePicker({
          suggestedName: '我的数据.json',
          types: [{ description: '数据文件', accept: { 'application/json': ['.json'] } }]
        });
        var name = await adoptHandle(handle, { forceOverwrite: true });
        ui().toast('已创建数据文件：' + name);
        return name;
      } catch (e) {
        if (e && e.name === 'AbortError') return null;
        ui().toast('创建失败：' + (e && e.message || e), true);
        return null;
      }
    }
    /* 降级：下载初始文件 + 引导连接 */
    downloadBlob('我的数据.json', json);
    ui().alert('已下载初始数据文件「我的数据.json」。\n\n请把它移动到固定位置（建议 APP 文件夹），然后点顶栏「● 未连接」→ 在弹出的选择框中选中这个文件，即完成连接。\n\n（也可以手动新建一个空的 .json 文件再连接，App 会自动写入初始数据）');
    return 'downloaded';
  };

  /* ============ 备份 ============ */
  function usedBackupNames() {
    try { return JSON.parse(localStorage.getItem(LS_BACKUPS) || '[]'); } catch (e) { return []; }
  }
  function rememberBackupName(name) {
    var arr = usedBackupNames();
    if (arr.indexOf(name) === -1) arr.push(name);
    if (arr.length > 200) arr = arr.slice(-200);
    try { localStorage.setItem(LS_BACKUPS, JSON.stringify(arr)); } catch (e) {}
  }

  async function backupDirHandle(create) {
    var dh = await idbGet('backupDir').catch(function () { return null; });
    if (dh) return dh;
    if (!create || !caps.dir) return null;
    try {
      dh = await window.showDirectoryPicker({ mode: 'readwrite', startIn: 'documents' });
      await idbSet('backupDir', dh);
      return dh;
    } catch (e) { return null; }
  }

  P.backup = async function (opts) {
    opts = opts || {};
    var json = S.serialize(store.data);
    var today = U.today();
    try {
      var dh = await backupDirHandle(!opts.noPicker);
      if (dh) {
        var sub = await dh.getDirectoryHandle('备份', { create: true });
        var names = [];
        for await (var n of sub.keys()) names.push(n);
        var fname = U.backupFileName(opts.baseName || '我的数据', today, names);
        var fh = await sub.getFileHandle(fname, { create: true });
        var w = await fh.createWritable();
        await w.write(json); await w.close();
        ui().toast('已备份到「备份」文件夹：' + fname);
        return fname;
      }
    } catch (e) { /* 目录方式失败 → 下载兜底 */ }
    var fname2 = U.backupFileName(opts.baseName || '我的数据', today, usedBackupNames());
    downloadBlob(fname2, json);
    rememberBackupName(fname2);
    ui().toast('已备份（浏览器下载）：' + fname2);
    return fname2;
  };

  /* ============ 恢复 ============ */
  function pickFileFallback() {
    return new Promise(function (res) {
      var input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,.txt,application/json';
      input.onchange = function () { res(input.files && input.files[0] ? input.files[0] : null); };
      input.click();
    });
  }

  P.restore = async function () {
    try {
      var text = null, fname = '';
      if (caps.open) {
        var [h] = await window.showOpenFilePicker({
          mode: 'readonly',
          types: [{ description: '备份文件', accept: { 'application/json': ['.json'], 'text/plain': ['.txt'] } }],
          multiple: false
        });
        fname = h.name;
        text = await readHandleText(h);
      } else {
        var f = await pickFileFallback();
        if (!f) return false;
        fname = f.name;
        text = await f.text();
      }
      var restored = S.normalize(text);
      if (restored === null) { ui().alert('所选文件无法识别（不是本 App 的数据/备份文件），未做任何改动。'); return false; }
      /* 恢复前快照 */
      try {
        var snapName = '恢复前快照-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '') + '.json';
        downloadBlob(snapName, S.serialize(store.data));
      } catch (e) {}
      store.setData(restored);
      store.saveNow();
      syncSettingsToShell();
      if (App.shell.rerender) App.shell.rerender();
      ui().toast('已从「' + fname + '」恢复（恢复前数据已自动另存为快照下载）');
      return true;
    } catch (e) {
      if (e && e.name === 'AbortError') return false;
      ui().toast('恢复失败：' + (e && e.message || e), true);
      return false;
    }
  };

  /* ============ 导出 / 清空 ============ */
  P.exportJSON = function () {
    var name = '我的数据-导出-' + U.today() + '.json';
    downloadBlob(name, S.serialize(store.data));
    ui().toast('已导出：' + name);
  };

  P.clearAll = function () {
    store.setData(S.defaultData());
    store.saveNow();
    syncSettingsToShell();
    if (App.shell.rerender) App.shell.rerender();
    ui().toast('已清空全部数据');
  };

  /* ============ 设置同步到外壳 ============ */
  function syncSettingsToShell() {
    var st = store.data.settings;
    App.shell.applyTheme(st.theme || 'light');
    App.shell.applySidebar(!!st.sidebarCollapsed);
  }
  P.syncSettingsToShell = syncSettingsToShell;

  /* ============ 启动 ============ */
  P.boot = async function () {
    store.setCacheAdapter(cacheAdapter);
    store.loadFromCache();
    var carried = L.carryOverTodos(store.data, U.today());
    if (carried) store.commit();
    syncSettingsToShell();
    store.setSaveStateUI(store.pendingOps().length ? 'cache' : 'idle');

    /* 尝试用记住的句柄静默连接（仅在已授权时，不弹权限框） */
    try {
      var saved = await idbGet('fileHandle');
      if (saved && (await saved.queryPermission({ mode: 'readwrite' })) === 'granted') {
        await adoptHandle(saved);
      }
    } catch (e) { /* 静默失败 → 显示未连接 */ }
    App.shell.setFileState(store.fileConnected(), store.fileName());
  };

  App.boot = function () { P.boot(); };
  App.persist = P;

  if (typeof module !== 'undefined' && module.exports) module.exports = globalThis.App;
});

<script>
/* ==== js/50-dom.js ==== */
/* 50-dom.js — DOM 助手与全局 UI（toast/弹窗表单/确认框/空状态/标签页/日期导航）
   纯校验逻辑 validateFieldValue 可在 Node 测试 */
(function (root, factory) {
  factory(root.App = root.App || {});
})(typeof globalThis !== 'undefined' ? globalThis : this, function (App) {
  'use strict';

  var U = App.util, L = App.logic;
  var D = {};

  /* ---- 纯校验（Node 可测） ----
     field: {key,label,type,required,min,max,validate(value, values)} */
  D.validateFieldValue = function (field, value, values) {
    if (field.validate) return field.validate(value, values || {}) || null;
    switch (field.type) {
      case 'number':
        return L.validateNumber(value, field.label, { required: !!field.required, min: field.min, max: field.max });
      case 'time':
        if (field.required && !value) return field.label + '不能为空';
        if (value && !U.isValidTime(value)) return field.label + '格式应为 HH:MM';
        return null;
      case 'date':
        if (field.required && !value) return field.label + '不能为空';
        if (value && !U.isValidDateStr(value)) return field.label + '格式应为 YYYY-MM-DD';
        return null;
      default:
        if (field.required) return L.validateRequired(value, field.label);
        return null;
    }
  };

  if (typeof document === 'undefined') {
    App.dom = D;
    if (typeof module !== 'undefined' && module.exports) module.exports = (typeof globalThis !== 'undefined' ? globalThis : this).App;
    return;
  }

  /* ---- DOM 助手 ---- */
  D.el = function (html) {
    var t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  };
  D.els = function (html) {
    var t = document.createElement('template');
    t.innerHTML = html.trim();
    return Array.prototype.slice.call(t.content.children);
  };
  D.on = function (root, selector, evt, fn) {
    root.addEventListener(evt, function (e) {
      var t = e.target.closest(selector);
      if (t && root.contains(t)) fn(e, t);
    });
  };

  var ui = {};
  App.ui = ui;
  App.dom = D;

  /* ---- toast ---- */
  ui.toast = function (msg, isErr) {
    var root = document.getElementById('toast-root');
    var el = D.el('<div class="toast' + (isErr ? ' toast-err' : '') + '">' + U.esc(msg) + '</div>');
    root.appendChild(el);
    setTimeout(function () { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 2200);
    setTimeout(function () { el.remove(); }, 2600);
  };

  /* ---- 弹窗表单 ----
     opts: {title, fields:[...], values:{}, wide, submitText, onSubmit(values)->errMap|null, onDelete}
     返回 {close} */
  ui.modal = function (opts) {
    var mask = D.el('<div class="modal-mask"><div class="modal' + (opts.wide ? ' wide' : '') + '"></div></div>');
    var box = mask.firstElementChild;
    var html = '<div class="modal-title">' + U.esc(opts.title || '') + '</div><form novalidate>';
    (opts.fields || []).forEach(function (f) {
      var v = (opts.values || {})[f.key];
      html += '<div class="form-row" data-key="' + f.key + '"><label' + (f.required ? ' class="required"' : '') + '>' + U.esc(f.label) + '</label>';
      switch (f.type) {
        case 'textarea':
          html += '<textarea class="textarea" rows="' + (f.rows || 3) + '" data-key="' + f.key + '" placeholder="' + U.esc(f.placeholder || '') + '">' + U.esc(v == null ? '' : v) + '</textarea>';
          break;
        case 'select':
          html += '<select class="select" data-key="' + f.key + '">' + (f.options || []).map(function (o) {
            var val = typeof o === 'object' ? o.value : o, lab = typeof o === 'object' ? o.label : o;
            return '<option value="' + U.esc(val) + '"' + (String(v) === String(val) ? ' selected' : '') + '>' + U.esc(lab) + '</option>';
          }).join('') + '</select>';
          break;
        case 'switch':
          html += '<label class="row"><input type="checkbox" data-key="' + f.key + '"' + (v ? ' checked' : '') + '><span>' + U.esc(f.onText || '是') + '</span></label>';
          break;
        case 'slider':
          html += '<div class="row"><input type="range" min="' + (f.min || 0) + '" max="' + (f.max || 100) + '" step="' + (f.step || 1) + '" value="' + (v == null ? (f.min || 0) : v) + '" data-key="' + f.key + '"><span class="slider-val muted">' + (v == null ? (f.min || 0) : v) + (f.unit || '') + '</span></div>';
          break;
        case 'number':
          html += '<input class="input" type="number" step="any" data-key="' + f.key + '" value="' + U.esc(v == null ? '' : v) + '" placeholder="' + U.esc(f.placeholder || '') + '">';
          break;
        case 'date':
          html += '<input class="input" type="date" data-key="' + f.key + '" value="' + U.esc(v == null ? '' : v) + '">';
          break;
        case 'time':
          html += '<input class="input" type="time" data-key="' + f.key + '" value="' + U.esc(v == null ? '' : v) + '">';
          break;
        default:
          html += '<input class="input" type="text" data-key="' + f.key + '" value="' + U.esc(v == null ? '' : v) + '" placeholder="' + U.esc(f.placeholder || '') + '"' + (f.list ? ' list="' + f.list + '"' : '') + '>';
      }
      html += '<div class="field-error"></div></div>';
    });
    html += '<div class="modal-actions">' +
      (opts.onDelete ? '<button type="button" class="btn btn-danger" data-act="delete">删除</button><span class="spacer" style="flex:1"></span>' : '') +
      '<button type="button" class="btn" data-act="cancel">取消</button>' +
      '<button type="submit" class="btn btn-primary">' + U.esc(opts.submitText || '保存') + '</button></div></form>';
    box.innerHTML = html;
    document.getElementById('modal-root').appendChild(mask);

    var form = box.querySelector('form');
    function readValues() {
      var vals = {};
      (opts.fields || []).forEach(function (f) {
        var input = form.querySelector('[data-key="' + f.key + '"]:not(.form-row)');
        if (!input) { vals[f.key] = (opts.values || {})[f.key]; return; }
        if (f.type === 'switch') vals[f.key] = input.checked;
        else if (f.type === 'number') vals[f.key] = input.value === '' ? null : U.toNum(input.value, null);
        else if (f.type === 'slider') vals[f.key] = U.toNum(input.value, f.min || 0);
        else vals[f.key] = input.value;
      });
      return vals;
    }
    function showErrors(errs) {
      var any = false;
      (opts.fields || []).forEach(function (f) {
        var row = form.querySelector('.form-row[data-key="' + f.key + '"]');
        if (!row) return;
        var msg = errs && errs[f.key];
        row.querySelector('.field-error').textContent = msg || '';
        var input = row.querySelector('.input, .textarea');
        if (input) input.classList.toggle('invalid', !!msg);
        if (msg) any = true;
      });
      return any;
    }
    form.addEventListener('input', function (e) {
      if (e.target.type === 'range') {
        var f = (opts.fields || []).filter(function (x) { return x.key === e.target.dataset.key; })[0];
        e.target.parentElement.querySelector('.slider-val').textContent = e.target.value + ((f && f.unit) || '');
      }
      var row = e.target.closest('.form-row');
      if (row) { row.querySelector('.field-error').textContent = ''; var i = row.querySelector('.input, .textarea'); if (i) i.classList.remove('invalid'); }
    });
    form.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); submit(); }
      if (e.key === 'Escape') close();
    });
    form.addEventListener('submit', function (e) { e.preventDefault(); submit(); });
    function submit() {
      var vals = readValues();
      var errs = {};
      (opts.fields || []).forEach(function (f) {
        var err = D.validateFieldValue(f, vals[f.key], vals);
        if (err) errs[f.key] = err;
      });
      if (showErrors(errs)) return;
      var ret = opts.onSubmit ? opts.onSubmit(vals) : null;
      if (ret && typeof ret === 'object') { if (showErrors(ret)) return; }
      close();
    }
    box.querySelector('[data-act="cancel"]').addEventListener('click', close);
    if (opts.onDelete) box.querySelector('[data-act="delete"]').addEventListener('click', function () {
      ui.confirm({ title: '删除确认', text: opts.deleteText || '确定删除吗？此操作不可撤销。', danger: true }).then(function (ok) {
        if (ok) { opts.onDelete(); close(); }
      });
    });
    mask.addEventListener('mousedown', function (e) { if (e.target === mask) close(); });
    function close() { mask.remove(); }
    var first = form.querySelector('.input, .textarea, select');
    if (first) setTimeout(function () { first.focus(); }, 30);
    return { close: close, readValues: readValues };
  };

  /* ---- 确认框 ---- */
  ui.confirm = function (opts) {
    return new Promise(function (resolve) {
      var mask = D.el('<div class="modal-mask"><div class="modal"></div></div>');
      var box = mask.firstElementChild;
      var need = opts.requireText || null;
      box.innerHTML = '<div class="modal-title">' + U.esc(opts.title || '确认') + '</div>' +
        '<div style="white-space:pre-wrap;line-height:1.7">' + U.esc(opts.text || '') + '</div>' +
        (need ? '<div class="form-row mt12"><label>请输入「' + U.esc(need) + '」以确认</label><input class="input" id="confirm-input"></div>' : '') +
        '<div class="modal-actions"><button class="btn" data-act="no">取消</button>' +
        '<button class="btn ' + (opts.danger ? 'btn-danger' : 'btn-primary') + '" data-act="yes"' + (need ? ' disabled' : '') + '>' + U.esc(opts.okText || '确定') + '</button></div>';
      document.getElementById('modal-root').appendChild(mask);
      var yes = box.querySelector('[data-act="yes"]');
      if (need) {
        var input = box.querySelector('#confirm-input');
        input.addEventListener('input', function () { yes.disabled = input.value.trim() !== need; });
        setTimeout(function () { input.focus(); }, 30);
      }
      function done(v) { mask.remove(); resolve(v); }
      yes.addEventListener('click', function () { done(true); });
      box.querySelector('[data-act="no"]').addEventListener('click', function () { done(false); });
      mask.addEventListener('mousedown', function (e) { if (e.target === mask) done(false); });
      mask.addEventListener('keydown', function (e) { if (e.key === 'Escape') done(false); });
    });
  };

  ui.alert = function (text, title) {
    return ui.confirm({ title: title || '提示', text: text, okText: '知道了' });
  };

  /* ---- 空状态 ---- */
  ui.emptyState = function (icon, text, btnText, onAdd) {
    var el = D.el('<div class="empty-state"><div class="empty-icon">' + (icon || '📭') + '</div><div>' + U.esc(text) + '</div>' +
      (btnText ? '<button class="btn btn-primary">' + U.esc(btnText) + '</button>' : '') + '</div>');
    if (btnText && onAdd) el.querySelector('button').addEventListener('click', onAdd);
    return el;
  };

  /* ---- 标签页 ---- */
  ui.tabs = function (list, activeId, onChange) {
    var el = D.el('<div class="tabs"></div>');
    el.innerHTML = list.map(function (t) {
      return '<button class="tab-btn' + (t.id === activeId ? ' active' : '') + '" data-id="' + t.id + '">' + U.esc(t.label) + '</button>';
    }).join('');
    el.addEventListener('click', function (e) {
      var b = e.target.closest('.tab-btn');
      if (b && b.dataset.id !== activeId) onChange(b.dataset.id);
    });
    return el;
  };

  /* ---- 日期导航条 ---- */
  ui.dateNav = function (current, onChange) {
    var el = D.el('<div class="row" style="margin-bottom:14px">' +
      '<button class="btn btn-small" data-act="prev">← 前一天</button>' +
      '<button class="btn btn-small" data-act="today">今天</button>' +
      '<button class="btn btn-small" data-act="next">后一天 →</button>' +
      '<input type="date" class="input" style="width:160px" value="' + U.esc(current) + '">' +
      '<span class="muted small date-label"></span></div>');
    var input = el.querySelector('input');
    var label = el.querySelector('.date-label');
    function set(d) { onChange(d); }
    el.querySelector('[data-act="prev"]').addEventListener('click', function () { set(U.addDays(current, -1)); });
    el.querySelector('[data-act="next"]').addEventListener('click', function () { set(U.addDays(current, 1)); });
    el.querySelector('[data-act="today"]').addEventListener('click', function () { set(U.today()); });
    input.addEventListener('change', function () { if (U.isValidDateStr(input.value)) set(input.value); });
    el.refresh = function (d) {
      current = d;
      input.value = d;
      label.textContent = d === U.today() ? '' : '正在查看 ' + U.fmtDateCN(d) + ' 周' + U.weekdayCN(d);
    };
    el.refresh(current);
    return el;
  };

  /* ---- 统计卡 ---- */
  ui.statCard = function (label, value, sub, onClick) {
    var el = D.el('<div class="card" style="padding:12px 16px' + (onClick ? ';cursor:pointer' : '') + '">' +
      '<div class="muted small">' + U.esc(label) + '</div>' +
      '<div style="font-size:20px;font-weight:700;margin:4px 0">' + U.esc(value) + '</div>' +
      (sub ? '<div class="muted small">' + U.esc(sub) + '</div>' : '') + '</div>');
    if (onClick) el.addEventListener('click', onClick);
    return el;
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = (typeof globalThis !== 'undefined' ? globalThis : this).App;
});

</script>
<script>
/* ==== js/52-charts.js ==== */
/* 52-charts.js — 轻量 SVG 图表（纯字符串构建，可 Node 测试；无外部依赖） */
(function (root, factory) {
  factory(root.App = root.App || {});
})(typeof globalThis !== 'undefined' ? globalThis : this, function (App) {
  'use strict';

  var U = App.util;
  var C = {};

  C.PALETTE = ['#4f7cff', '#e85d9a', '#22a06b', '#ff8c42', '#7a5cff', '#2bb3c0', '#d9a514', '#f2555a'];

  function esc(s) { return U.esc(s); }

  function emptySvg(w, h, text) {
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" role="img">' +
      '<text x="' + (w / 2) + '" y="' + (h / 2) + '" text-anchor="middle" fill="var(--text-soft)" font-size="13">' + esc(text || '暂无数据') + '</text></svg>';
  }

  /* ---- 折线图 ----
     series: [{name, points:[{date, value}]}]
     opts: {width, height, from, to, yFmt} */
  C.lineChart = function (series, opts) {
    opts = opts || {};
    var W = opts.width || 720, H = opts.height || 240;
    var pad = { l: 46, r: 14, t: 14, b: 26 };
    var all = [];
    (series || []).forEach(function (s) { (s.points || []).forEach(function (p) { all.push(p); }); });
    if (!all.length) return emptySvg(W, H);

    var dates = all.map(function (p) { return p.date; }).sort();
    var from = opts.from || dates[0], to = opts.to || dates[dates.length - 1];
    var span = Math.max(1, U.diffDays(from, to));
    var vals = all.map(function (p) { return p.value; });
    var maxV = Math.max.apply(null, vals.concat([1]));
    var minV = Math.min.apply(null, vals.concat([0]));
    if (maxV === minV) maxV = minV + 1;

    function x(date) { return pad.l + (U.diffDays(from, date) / span) * (W - pad.l - pad.r); }
    function y(v) { return pad.t + (1 - (v - minV) / (maxV - minV)) * (H - pad.t - pad.b); }

    var parts = ['<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '" role="img" class="chart">'];
    /* 网格与 y 轴刻度（4 档） */
    for (var g = 0; g <= 4; g++) {
      var vy = minV + (maxV - minV) * g / 4;
      var yy = y(vy);
      parts.push('<line x1="' + pad.l + '" y1="' + yy + '" x2="' + (W - pad.r) + '" y2="' + yy + '" stroke="var(--border)" stroke-width="1"/>');
      parts.push('<text x="' + (pad.l - 6) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="10" fill="var(--text-soft)">' + esc(opts.yFmt ? opts.yFmt(vy) : Math.round(vy)) + '</text>');
    }
    /* x 轴首尾日期 */
    parts.push('<text x="' + pad.l + '" y="' + (H - 8) + '" font-size="10" fill="var(--text-soft)">' + esc(U.fmtDateCN(from)) + '</text>');
    parts.push('<text x="' + (W - pad.r) + '" y="' + (H - 8) + '" text-anchor="end" font-size="10" fill="var(--text-soft)">' + esc(U.fmtDateCN(to)) + '</text>');

    (series || []).forEach(function (s, si) {
      var color = s.color || C.PALETTE[si % C.PALETTE.length];
      var pts = (s.points || []).slice().sort(U.byDateAsc);
      if (!pts.length) return;
      var d = pts.map(function (p, i) {
        return (i ? 'L' : 'M') + x(p.date).toFixed(1) + ' ' + y(p.value).toFixed(1);
      }).join(' ');
      parts.push('<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2"/>');
      pts.forEach(function (p) {
        parts.push('<circle cx="' + x(p.date).toFixed(1) + '" cy="' + y(p.value).toFixed(1) + '" r="3" fill="' + color + '"><title>' + esc(s.name + ' ' + p.date + '：' + p.value) + '</title></circle>');
      });
      /* 图例 */
      parts.push('<g><rect x="' + (pad.l + si * 110) + '" y="2" width="10" height="10" rx="2" fill="' + color + '"/>' +
        '<text x="' + (pad.l + si * 110 + 14) + '" y="11" font-size="11" fill="var(--text-soft)">' + esc(s.name) + '</text></g>');
    });
    parts.push('</svg>');
    return parts.join('');
  };

  /* ---- 堆叠柱状图 ----
     groups: [{label, parts:[{value, color?, name?}]}]
     opts: {width, height, yFmt, onHint} */
  C.barChart = function (groups, opts) {
    opts = opts || {};
    var W = opts.width || 720, H = opts.height || 220;
    var pad = { l: 52, r: 14, t: 14, b: 26 };
    groups = groups || [];
    if (!groups.length) return emptySvg(W, H);
    var totals = groups.map(function (g) { return U.sum(g.parts, function (p) { return p.value || 0; }); });
    var maxV = Math.max.apply(null, totals.concat([1]));

    var bw = (W - pad.l - pad.r) / groups.length;
    var parts = ['<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '" role="img" class="chart">'];
    for (var g = 0; g <= 4; g++) {
      var vy = maxV * g / 4;
      var yy = pad.t + (1 - g / 4) * (H - pad.t - pad.b);
      parts.push('<line x1="' + pad.l + '" y1="' + yy + '" x2="' + (W - pad.r) + '" y2="' + yy + '" stroke="var(--border)" stroke-width="1"/>');
      parts.push('<text x="' + (pad.l - 6) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="10" fill="var(--text-soft)">' + esc(opts.yFmt ? opts.yFmt(vy) : Math.round(vy)) + '</text>');
    }
    groups.forEach(function (grp, gi) {
      var cx = pad.l + gi * bw + bw / 2;
      var barW = Math.min(46, bw * 0.6);
      var yCursor = pad.t + (H - pad.t - pad.b);
      (grp.parts || []).forEach(function (p, pi) {
        var h = (p.value || 0) / maxV * (H - pad.t - pad.b);
        if (h <= 0) return;
        yCursor -= h;
        parts.push('<rect data-idx="' + gi + '" x="' + (cx - barW / 2) + '" y="' + yCursor.toFixed(1) + '" width="' + barW + '" height="' + h.toFixed(1) + '" fill="' + (p.color || C.PALETTE[pi % C.PALETTE.length]) + '" rx="2"><title>' + esc(grp.label + ' ' + (p.name || '') + '：' + (opts.yFmt ? opts.yFmt(p.value) : p.value)) + '</title></rect>');
      });
      parts.push('<text data-idx="' + gi + '" x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10" fill="var(--text-soft)">' + esc(grp.label) + '</text>');
    });

    App.modules.forEach(function (m) { M[m.id] = m; });

    var ns = L.nextSchedule(data.media.schedule, today);
    card(M.media, '', [
      ns ? U.esc((ns.status === '计划中' ? '下次发布：' : '最近发布：') + U.fmtDateCN(ns.date) + ' ' + U.esc(ns.platform || '') + '《' + ns.title + '》') : '<span class="muted">暂无发布计划</span>',
      '<span class="muted small">选题 ' + data.media.topics.filter(function (t) { return t.status !== '已放弃' && t.status !== '已发布'; }).length + ' 个进行中</span>'
    ], function () { App.router.go('media'); });

    var ds = L.devSummary(data.dev.projects);
    card(M.dev, '', [
      '进行中项目 <b>' + ds.inProgressCount + '</b> 个',
      ds.latestNextStep ? '下一步：' + U.esc(ds.latestNextStep) : '<span class="muted">暂无项目</span>'
    ], function () { App.router.go('dev'); });

    var cs = L.incomeMonthSummary(data.consult.incomes, U.monthOf(today));
    card(M.consult, '', [
      '本月收入 <b>¥' + U.fmtMoney(cs.received) + '</b>',
      cs.unreceivedCount ? '未收 ' + cs.unreceivedCount + ' 笔 ¥' + U.fmtMoney(cs.unreceived) : '<span class="muted">无未收款</span>'
    ], function () { App.router.go('consult'); });

    var streak = L.streakDays(data.study.checkins, today);
    card(M.study, '', [
      '连续打卡 <b>' + streak + '</b> 天',
      data.study.checkins[today] ? '今日已学 ' + U.fmtMinutes(data.study.checkins[today].minutes) : '<span class="muted">今天还没打卡</span>'
    ], function () { App.router.go('study'); });

    var ws = L.weightSummary(data.diet.weights);
    var eaten = L.dietTodayDone(data.diet.records, today);
    card(M.diet, '', [
      '今日三餐已记 ' + eaten + '/3',
      ws ? '最近体重 ' + ws.latest.kg + ' kg（' + (ws.change > 0 ? '+' : '') + ws.change.toFixed(1) + '）' : '<span class="muted">暂无体重记录</span>'
    ], function () { App.router.go('diet'); });

    card(M.fun, '', [
      '本周娱乐 ' + U.fmtMinutes(L.funWeekMinutes(data.fun.records, today)),
      '<span class="muted small">本月 ' + U.fmtMinutes(L.funMonthMinutes(data.fun.records, today)) + '</span>'
    ], function () { App.router.go('fun'); });

    view.appendChild(cards);
  }

  App.shell.registerPage('home', render);

  if (typeof module !== 'undefined' && module.exports) module.exports = (typeof globalThis !== 'undefined' ? globalThis : this).App;
});
